function normPhone(x){ return String(x||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g,''); }
async function doSignup(){
  let name=v('name'), phone=v('phone'), email=v('email'), pass=v('pass');
  if(!name||!email||!pass||!phone){ m('m', msgBox('املأ الاسم ورقم الموبايل والإيميل وكلمة السر','err')); return; }
  if(!/^01[0125][0-9]{8}$/.test(normPhone(phone))){ m('m', msgBox('رقم الموبايل لازم يكون رقم مصري صحيح (11 رقم بيبدأ بـ 01)','err')); return; }
  if(pass.length<6){ m('m', msgBox('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل','err')); return; }
  phone = normPhone(phone);
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if(error){
    const t=(error.message||'').toLowerCase();
    m('m', msgBox(t.includes('already')?'الإيميل ده متسجل قبل كده. جرّب تسجيل الدخول أو "نسيت كلمة السر".':t.includes('password')?'كلمة السر لازم تكون 6 حروف أو أرقام على الأقل':t.includes('rate')?'محاولات كتير، استنى شوية وجرّب تاني':t.includes('invalid')?'اكتب إيميل صحيح':'حصل خطأ في التسجيل، جرّب تاني','err')); return; }
  if(!data.session){ m('m', msgBox('الإيميل ده متسجل قبل كده. جرّب تسجيل الدخول أو "نسيت كلمة السر".','err')); return; }
  const ins = await sb.from('students').insert({ id: data.user.id, full_name: name, phone, email });
  if(ins.error){ m('m', msgBox('الحساب اتعمل بس حصل خطأ في حفظ البيانات. اعمل تسجيل دخول وكلّم أحمد لو المشكلة فضلت.','err')); }
  route();
}

let _rBusy=false;
async function doResetCode(){
  if(_rBusy) return;
  const email=v('remail').toLowerCase(), code=normPhone(v('rcode')), p1=document.getElementById('rpass').value, p2=document.getElementById('rpass2').value;
  if(!email||!/^[0-9]{8}$/.test(code)){ m('m', msgBox('اكتب الإيميل والكود (8 أرقام)','err')); return; }
  if(p1.length<8){ m('m', msgBox('كلمة السر لازم تكون 8 حروف أو أكتر','err')); return; }
  if(p1!==p2){ m('m', msgBox('كلمتين السر مش زي بعض','err')); return; }
  _rBusy=true; const b=document.getElementById('resetBtn'); b.disabled=true; b.textContent='جاري التغيير...';
  const { data, error } = await sb.rpc('reset_password_with_code', { p_email: email, p_code: code, p_new: p1 });
  _rBusy=false; b.disabled=false; b.textContent='تغيير كلمة السر';
  if(error){ m('m', msgBox('حصل خطأ، جرّب تاني','err')); return; }
  if(data==='ok'){ viewLogin().then(()=>m('m', msgBox('كلمة السر اتغيرت ✅ دخّل بكلمة السر الجديدة.','ok'))); return; }
  if(data==='weak'){ m('m', msgBox('كلمة السر لازم تكون 8 حروف أو أكتر','err')); return; }
  m('m', msgBox('الإيميل أو الكود غلط أو الكود انتهى. اطلب كود جديد من أحمد.','err'));
}

async function sourceHtml(u){
  if(!u) return '';
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}?rel=0&modestbranding=1" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
  const gd = u.match(/(?:drive|docs)\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/);
  if(gd) return `<iframe src="https://drive.google.com/file/d/${gd[1]}/preview" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
  if(/^https?:\/\//.test(u)) return `<video controls preload="metadata" src="${h(u)}"></video>`;
  const { data: s2, error } = await sb.storage.from('lectures').createSignedUrl(u, 3600);
  if(error || !s2) return '';
  return `<video controls preload="metadata" src="${h(s2.signedUrl)}"></video>`;
}

    <label>الترتيب</label><input id="lorder" type="number" dir="ltr" value="${(lectures||[]).length+1}">
    <button class="btn" onclick="addLecture()">إضافة</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">📚 المحاضرات الحالية</h2>
    ${lecRows ? `<table><tr><th>#</th><th>العنوان</th><th></th></tr>${lecRows}</table>` : '<p class="small">مفيش محاضرات لسه.</p>'}
  </div>`);
  if(!isMain){
    ['courseCard','manualCard','resetCard','staffCard'].forEach(i=>{ const e=document.getElementById(i); if(e) e.remove(); });
    const cards=[...document.querySelectorAll('.card')].filter(c=>/تغيير كلمة سر الأدمن|إضافة محاضرة|المحاضرات الحالية/.test(c.innerText)); cards.forEach(c=>c.remove());
    document.querySelectorAll('button.red').forEach(b=>{ if(/deleteStudent/.test(b.getAttribute('onclick')||'')) b.remove(); });
    const hd=document.querySelector('.card h2'); if(hd) hd.insertAdjacentHTML('afterend','<p class="small">حسابك: مساعد أدمن</p>');
  }
  { const me=(typeof _students!=='undefined'&&_students||[]).find(x=>x.id===user.id); const pu=me?((await avatarUrl(me.photo_path))||(isMain?'/media/instructor-avatar.jpg':'')):'';
    const form = me ? `<div id="pm" style="margin-top:12px"></div>
    <div style="text-align:center;margin:14px 0"><img id="pimg" src="${pu}" style="${pu?'':'display:none;'}width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #a78bfa" alt=""><div id="pph" style="${pu?'display:none;':''}font-size:64px">🙂</div></div>
    <label>الصورة الشخصية (jpg / png حتى 2 ميجا)</label><input id="pphoto" type="file" accept="image/jpeg,image/png,image/webp">
    <label>الاسم</label><input id="pname" value="${h(me.full_name||'')}">
    <label>السن</label><input id="page" dir="ltr" inputmode="numeric" value="${h(me.age||'')}">
    <label>رقم موبايلك</label><input id="pphone" dir="ltr" inputmode="numeric" value="${h(me.phone||'')}">
    <label>رقم موبايل ولي الأمر (اختياري)</label><input id="pguard" dir="ltr" inputmode="numeric" value="${h(me.guardian_phone||'')}">
    <label>المحافظة</label><select id="pgov"><option value="">اختار المحافظة</option>${GOVS.map(g=>`<option ${g===me.governorate?'selected':''}>${g}</option>`).join('')}</select>
    <label>العنوان</label><input id="paddr" value="${h(me.address||'')}">
    <div style="margin-top:16px"><button class="btn" onclick="saveProfile('${me.id}')">💾 حفظ</button></div>` : '';
    app.insertAdjacentHTML('afterbegin', `<div class="card" data-tab="profile"><h2>👤 الملف الشخصي</h2><p style="margin-top:8px"><b>${isMain?'أحمد وليد (الأدمن الرئيسي)':'مساعد أدمن'}</b></p><p class="small" dir="ltr" style="text-align:right">${h(user.email)}</p>${form}</div>`); }
  { const AK={register:'🆕',purchase:'🛒',topup:'💰',adjust:'✏️',transfer_report:'📩',chat:'💬',reset:'🔑'};
    const L=(anotifs||[]).map(n=>`<div class="notif ${n.read_at?'':'new'}"><b>${h(n.title)}</b>${n.read_at?'':' <span class="badge active">جديد</span>'}<p style="margin-top:6px">${h(n.body)}</p><p class="small" style="margin-top:6px">${new Date(n.created_at).toLocaleString('ar-EG')}${n.student_id?` · <a href="#" onclick="adminProfile('${n.student_id}');return false">فتح ملف الطالب</a>`:''}</p></div>`).join('') || '<p class="small" style="margin-top:12px">مفيش إشعارات لسه. أي حاجة تحصل على المنصة هتظهر هنا.</p>';
    app.insertAdjacentHTML('afterbegin',`<div class="card" data-tab="inbox"><h2>🔔 إشعارات المنصة</h2><p class="small" style="margin:6px 0 10px">تسجيل جديد، شراء، شحن، بلاغ تحويل، رسائل الطلاب، طلبات نسيت كلمة السر.</p>${L}</div>`);
    if(curTab==='inbox' && (anotifs||[]).some(n=>!n.read_at)){ sb.rpc('admin_notifs_read').then(()=>{ const nn=document.getElementById('bellN'); if(nn){ nn.innerText='0'; nn.classList.add('hidden'); } }); } }
  app.insertAdjacentHTML('afterbegin','<div class="card" data-tab="chats"><h2>💬 رسائل الطلاب</h2><div id="chatsBody" style="margin-top:12px"><p class="small">جارِ التحميل...</p></div></div>');
  renderTabs('admin', curTab); watchPresence(); adminChats(); if(window._aChT) clearInterval(window._aChT); window._aChT=setInterval(()=>{ const b=document.getElementById('chatsBody'); if(!b){ clearInterval(window._aChT); return; } if(!document.hidden && curTab==='chats' && !(document.getElementById('aIn')&&document.getElementById('aIn').value)) adminChats(); },10000);
  const RULES=[[/رسائل الطلاب/,'chats'],[/سجل كل/,'log'],[/سجل شحن/,'pay'],[/شحن رصيد طالب|تصحيح يدوي/,'topup'],[/المساعدين/,'staff'],[/الملف الشخصي|تغيير كلمة سر/,'profile'],[/إضافة محاضرة/,'addlec'],[/المحاضرات الحالية|معاينة|محاضر/,'courses'],[/فتح ملف|الطلاب/,'students'],[/.*/,'home']];
  app.querySelectorAll(':scope > .card').forEach(c=>{ let t=c.getAttribute('data-tab'); if(!t){ const hh=(c.querySelector('h2')||{}).innerText||''; t=RULES.find(r=>r[0].test(hh))[1]; } c.style.display = (t===curTab)?'':'none'; });
}
async function approve(sid, rid){
  await sb.from('unlock_requests').update({ status: 'approved' }).eq('id', rid); await alog_('مراجعة بلاغ تحويل',((_students||[]).find(x=>x.id===sid)||{}).full_name,'تمت المراجعة',sid);
  route();
}
async function rejectReq(rid){ await sb.from('unlock_requests').update({ status: 'rejected' }).eq('id', rid); await alog_('رفض بلاغ تحويل','-','رفض'); route(); }
async function issueResetCode(rid, sid){
  const st=(_students||[]).find(x=>x.id===sid)||{};
  const { data: code, error } = await sb.rpc('admin_issue_reset_code', { target: sid });
  if(error){ alert('حصل خطأ: '+error.message); return; }
  await sb.from('password_reset_requests').update({ status:'done' }).eq('id', rid);
  const intl='2'+(st.phone||'');
  const txt='كود إعادة تعيين كلمة السر بتاعتك على منصة Ahmed walid: '+code+'\nصالح 30 دقيقة ويتستخدم مرة واحدة. افتح الموقع > نسيت كلمة السر > عندي كود، واكتب إيميلك والكود وكلمة السر الجديدة. ماتبعتش الكود لحد.';
  document.getElementById('tempbox').innerHTML = `<div class="msg ok">كود ${h(st.full_name||'')}: <b dir="ltr" style="font-size:22px;letter-spacing:3px">${code}</b> (صالح 30 دقيقة، مرة واحدة)<br><span class="small">اتبعت على رقمه المسجل ${h(st.phone||'-')} بس. الطالب هيختار كلمة سره بنفسه ومحدش هيشوفها.</span><br><a class="btn wa" target="_blank" href="https://wa.me/${intl}?text=${encodeURIComponent(txt)}">ابعت الكود للطالب على واتساب</a></div>`;
}
async function dismissReset(rid){ await sb.from('password_reset_requests').update({ status:'done' }).eq('id', rid); await alog_('إخفاء طلب نسيان كلمة سر','-','تجاهل'); route(); }
async function deleteStudent(sid, name){
  if(!confirm('متأكد إنك عايز تمسح حساب «'+name+'» نهائي؟ هيتمسح الحساب وكل طلباته، وهيقدر يسجل من جديد بنفس الإيميل. مفيش رجوع.')) return;
  const { error } = await sb.rpc('admin_delete_student', { target: sid });
  if(error){ alert('حصل خطأ: '+error.message); return; }
  await alog_('حذف حساب طالب',name,'حذف نهائي');
  route();
}
async function changeAdminPassword(){
  const p1=document.getElementById('newpass').value;
  if(p1.length<6){ m('pwmsg', msgBox('كلمة السر لازم تكون 6 حروف على الأقل','err')); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ m('pwmsg', msgBox(h(error.message),'err')); return; }
  document.getElementById('newpass').value='';
  m('pwmsg', msgBox('تم تغيير كلمة السر ✅','ok'));
}
async function setActive(sid, on){
  const reason = prompt(on?'سبب فتح الكورس مباشر (من غير خصم):':'سبب قفل الكورس:', on?'دفع ولم يتسجل':'');
  if(reason===null) return;
  if(reason.trim().length<2){ alert('لازم تكتب السبب'); return; }
  const { error } = await sb.rpc('admin_set_access', { target: sid, active: on, reason });
  if(error){ alert('حصل خطأ: '+error.message); return; }
  route();
}
function _byCode(id){ const c=normPhone(document.getElementById(id).value); return _students.find(x=>x.student_code===c); }
function staffLookup(){ const st=_byCode('scode'); const c=document.getElementById('scode').value; document.getElementById('sname').innerHTML = !c?'':st?`<span class="badge active">✅ ${h(st.full_name)}</span>`:'<span class="badge pending">مفيش طالب بالكود ده</span>'; }
async function staffAct(kind, code){
  code = code || normPhone(document.getElementById('scode').value);
  const st=_students.find(x=>x.student_code===code);
  if(!st){ m('smsg', msgBox('اكتب كود طالب صحيح','err')); return; }
  if(!confirm((kind==='add'?'تعيّن ':'تشيل صلاحية ')+st.full_name+(kind==='add'?' مساعد أدمن؟':' من المساعدين؟'))) return;
  const { error } = await sb.rpc(kind==='add'?'admin_add_staff':'admin_remove_staff', { target_code: code });
  if(error){ m('smsg', msgBox('حصل خطأ: '+h(error.message),'err')); return; }
  await route(); m('smsg', msgBox('تم ✅','ok'));
}
async function manualAdjust(){
  const st=_byCode('mcode'); const amt=parseFloat(String(document.getElementById('mamount').value).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))); const reason=document.getElementById('mreason').value.trim();
  if(!st){ m('mmsg', msgBox('اكتب كود طالب صحيح','err')); return; }
  if(!amt){ m('mmsg', msgBox('اكتب المبلغ (موجب للاسترجاع، سالب للخصم)','err')); return; }
  if(reason.length<2){ m('mmsg', msgBox('اكتب السبب','err')); return; }
  if(!confirm((amt>0?'ترجّع/تضيف ':'تخصم ')+Math.abs(amt)+' جنيه '+(amt>0?'لرصيد ':'من رصيد ')+st.full_name+'؟')) return;
  const { error } = await sb.rpc('admin_adjust_balance', { target: st.id, amount: amt, reason });
  if(error){ m('mmsg', msgBox(error.message.includes('check')||error.message.includes('balance')?'الخصم أكبر من رصيد الطالب':'حصل خطأ: '+h(error.message),'err')); return; }
  await route(); m('mmsg', msgBox('تم ✅','ok'));
}
async function manualGrant(){
  const st=_byCode('mcode'); const reason=document.getElementById('mreason').value.trim();
  if(!st){ m('mmsg', msgBox('اكتب كود طالب صحيح','err')); return; }
  if(reason.length<2){ m('mmsg', msgBox('اكتب السبب','err')); return; }
  if(!confirm('تفتح الكورس لـ '+st.full_name+' مباشر من غير خصم؟')) return;
  const { error } = await sb.rpc('admin_set_access', { target: st.id, active: true, reason });
  if(error){ m('mmsg', msgBox('حصل خطأ: '+h(error.message),'err')); return; }
  await route(); m('mmsg', msgBox('الكورس اتفتح للطالب ✅ (من غير خصم)','ok'));
}
async function uploadOrLink(fileId, urlId, tag){
  const u=v(urlId); const f=document.getElementById(fileId).files[0];
  if(f){
    if(f.size > 50*1024*1024) return { err:'الملف أكبر من 50 ميجا. ارفعه على يوتيوب (غير مدرج) أو جوجل درايف وحط الرابط.' };
    const ext = (f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'') || 'mp4';
    const path = 'lec-' + tag + '-' + Date.now() + '.' + ext;
    const up = await sb.storage.from('lectures').upload(path, f, { contentType: f.type || 'video/mp4', upsert: false });
    if(up.error) return { err:'فشل الرفع: '+h(up.error.message) };
    return { val: path };
  }
  return { val: u || null };
}
async function addLecture(){
  const t=v('ltitle');
  if(!t){ m('m', msgBox('اكتب عنوان المحاضرة','err')); return; }
  if(!v('lurl') && !document.getElementById('lfile').files[0]){ m('m', msgBox('السيرفر 1 مطلوب: ارفع ملف أو حط رابط','err')); return; }
  m('m', msgBox('جاري الرفع... متقفلش الصفحة','info'));
  const s1 = await uploadOrLink('lfile','lurl','s1'); if(s1.err){ m('m', msgBox(s1.err,'err')); return; }
  const s2 = await uploadOrLink('lfile2','lurl2','s2'); if(s2.err){ m('m', msgBox(s2.err,'err')); return; }
  const { error } = await sb.from('lectures').insert({ title: t, description: v('ldesc'), video_url: s1.val, video_url2: s2.val, sort_order: parseInt(v('lorder'))||0 });
  if(error){ m('m', msgBox(h(error.message),'err')); return; }
  await alog_('إضافة محاضرة','-',t);
  route();
}
async function delLecture(id){ if(!confirm('متأكد من حذف المحاضرة؟')) return; const { data: l } = await sb.from('lectures').select('video_url, video_url2').eq('id', id).single(); await sb.from('lectures').delete().eq('id', id); await alog_('حذف محاضرة','-','محاضرة رقم '+id); const paths=[l&&l.video_url, l&&l.video_url2].filter(x=>x && !/^https?:\/\//.test(x)); if(paths.length) await sb.storage.from('lectures').remove(paths); route(); }

let _loaderT=0;
function showLoader(){ const l=document.getElementById('loader'); l.classList.remove('off'); _loaderT=Date.now(); }
function hideLoader(){ const l=document.getElementById('loader'); const w=Math.max(0,500-(Date.now()-_loaderT)); setTimeout(()=>l.classList.add('off'),w); }
async function route(){ showLoader(); try{ return await _route(); } finally{ hideLoader(); } }
async function _route(){
  const s = await getSession();
  document.getElementById('logoutBtn').classList.toggle('hidden', !s);
  document.getElementById('whoami').innerText = s ? s.user.email : '';
  if(!s){ renderTabs(''); document.getElementById('bell').classList.add('hidden'); await viewLogin(); return; }
  if(isAdmin(s.user)){ return viewAdmin(s.user,'main'); }
  startPresence();
  const { data: sf } = await sb.from('staff').select('user_id').eq('user_id', s.user.id).maybeSingle();
  if(sf){ return viewAdmin(s.user,'helper'); }
  return viewStudent(s.user);
}
route();
</script>
