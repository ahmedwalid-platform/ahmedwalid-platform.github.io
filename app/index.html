  await sb.from('students').insert({ id: data.user.id, full_name: name, phone, email });

}

async function playLecture(id){
  const box = document.getElementById('vid-'+id);
  const { data } = await sb.from('lectures').select('video_url').eq('id', id).single();
  if(!data) return;
  const u = data.video_url;
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt){
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen allow="autoplay"></iframe>`;
  } else if(/^https?:\/\//.test(u)){
    box.innerHTML = `<video controls preload="metadata" src="${h(u)}"></video>`;
  } else {
    const { data: s, error } = await sb.storage.from('lectures').createSignedUrl(u, 3600);
    if(error || !s){ box.innerHTML = msgBox('حصلت مشكلة في تحميل الفيديو، جرّب تاني.','err'); box.classList.remove('hidden'); return; }
    box.innerHTML = `<video controls preload="metadata" src="${h(s.signedUrl)}"></video>`;
  }
  box.classList.remove('hidden');
}
async function requestUnlock(){
  const { data: s } = await sb.auth.getSession();
  if(!s.session) return;
  const { data: st } = await sb.from('students').select('full_name').eq('id', s.session.user.id).single();
  const { error } = await sb.from('unlock_requests').insert({ student_id: s.session.user.id, sender_name: st ? st.full_name : '' });
  if(error){ alert('حصل خطأ، جرب تاني'); return; }
  route();
}

  const courseList = (lectures||[]).map((l,i)=>`
    <div class="lecture">
      <h3>${i+1}. ${h(l.title)}</h3>
      <p class="small">${h(l.description||'')}</p>
      <button class="btn" style="margin-top:12px" onclick="playLecture(${l.id})">▶ شغّل الفيديو</button>
      <div class="video-box hidden" id="vid-${l.id}"></div>
    </div>`).join('') || '<p class="small">مفيش محاضرات لسه.</p>';
  setMsg(`
  <div class="card" id="courseCard">
    <h2 style="margin-bottom:14px">🎬 دخول الكورس (معاينة الأدمن)</h2>
    ${courseList}
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">📩 طلبات التفعيل (${(reqs||[]).length})</h2>
    ${reqRows ? `<table><tr><th>الاسم</th><th>التاريخ</th><th></th></tr>${reqRows}</table>` : '<p class="small">مفيش طلبات منتظرة.</p>'}
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">👥 الطلاب (${(students||[]).length})</h2>
    <table><tr><th>الاسم</th><th>الإيميل</th><th>الموبايل</th><th>الحالة</th><th></th></tr>${stRows}</table>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">➕ إضافة محاضرة</h2>
    <div id="m"></div>
    <label>العنوان</label><input id="ltitle">
    <label>الوصف</label><input id="ldesc">
    <label>اسم ملف الفيديو في التخزين (مثل intro.mp4) أو رابط يوتيوب</label><input id="lurl" dir="ltr">
    <label>الترتيب</label><input id="lorder" type="number" dir="ltr" value="${(lectures||[]).length+1}">
    <button class="btn" onclick="addLecture()">إضافة</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">📚 المحاضرات الحالية</h2>
    ${lecRows ? `<table><tr><th>#</th><th>العنوان</th><th></th></tr>${lecRows}</table>` : '<p class="small">مفيش محاضرات لسه.</p>'}
  </div>`);
}
async function approve(sid, rid){
  await sb.from('enrollments').upsert({ student_id: sid, status: 'active', approved_at: new Date().toISOString() });
  await sb.from('unlock_requests').update({ status: 'approved' }).eq('id', rid);
  route();
}
async function rejectReq(rid){ await sb.from('unlock_requests').update({ status: 'rejected' }).eq('id', rid); route(); }
async function setActive(sid, on){
  await sb.from('enrollments').upsert({ student_id: sid, status: on ? 'active' : 'pending', approved_at: on ? new Date().toISOString() : null });
  route();
}
async function addLecture(){
  const t=v('ltitle'), u=v('lurl');
  if(!t||!u){ m('m', msgBox('اكتب العنوان ورابط الفيديو','err')); return; }
  const { error } = await sb.from('lectures').insert({ title: t, description: v('ldesc'), video_url: u, sort_order: parseInt(v('lorder'))||0 });
  if(error){ m('m', msgBox(h(error.message),'err')); return; }
  route();
}
async function delLecture(id){ if(!confirm('متأكد من حذف المحاضرة؟')) return; await sb.from('lectures').delete().eq('id', id); route(); }

async function route(){
  const s = await getSession();
  document.getElementById('logoutBtn').classList.toggle('hidden', !s);
  document.getElementById('whoami').innerText = s ? s.user.email : '';
  if(!s){ viewLogin(); return; }
  if(isAdmin(s.user)){ viewAdmin(s.user); } else { viewStudent(s.user); }
}
route();
</script>
