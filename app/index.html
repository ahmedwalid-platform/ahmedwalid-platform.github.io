<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed walid | منصة الدورات التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(99,102,241,.25),transparent),radial-gradient(900px 500px at 10% 110%,rgba(16,185,129,.12),transparent),#0a0e1a;color:#e8ebf4;min-height:100vh}
.wrap{max-width:880px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;background:rgba(13,18,34,.75);backdrop-filter:blur(14px);border-bottom:1px solid rgba(120,130,255,.15);position:sticky;top:0;z-index:10}
header h1{font-size:20px;font-weight:900;background:linear-gradient(90deg,#818cf8,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
header h1 span{color:#f1f3fa;-webkit-text-fill-color:#f1f3fa}
.btn{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;box-shadow:0 4px 18px rgba(99,102,241,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(99,102,241,.5)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.btn.ghost{background:rgba(99,102,241,.08);border:1px solid rgba(129,140,248,.4);box-shadow:none;color:#c7cdfb}
.btn.green{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.3)}
.btn.red{background:linear-gradient(135deg,#ef4444,#dc2626);padding:7px 14px;font-size:13px;box-shadow:0 3px 10px rgba(239,68,68,.3)}
.btn.wa{background:linear-gradient(135deg,#25d366,#128c4b);box-shadow:0 4px 14px rgba(37,211,102,.3);text-decoration:none;display:inline-block}
.card{background:rgba(17,23,42,.85);backdrop-filter:blur(10px);border:1px solid rgba(120,130,255,.16);border-radius:20px;padding:26px;margin-top:22px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
input,textarea{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(120,130,255,.25);background:#0a0e1a;color:#fff;font-size:15px;margin-bottom:14px;font-family:'Cairo',sans-serif}
input:focus,textarea:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
label{display:block;margin-bottom:7px;font-size:14px;color:#a3aac4;font-weight:600}
.msg{padding:13px 17px;border-radius:12px;margin:12px 0;font-size:14px;font-weight:600}
.msg.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.msg.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#6ee7b7}
.msg.info{background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);color:#c7cdfb}
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:800}
.badge.pending{background:rgba(245,197,66,.14);color:#f5c542;border:1px solid rgba(245,197,66,.35)}
.badge.active{background:rgba(16,185,129,.14);color:#4ade80;border:1px solid rgba(74,222,128,.35)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 8px;border-bottom:1px solid rgba(120,130,255,.12);text-align:right}
th{color:#a3aac4;font-weight:700}
.video-box{margin-top:16px}
.video-box video,.video-box iframe{width:100%;aspect-ratio:16/9;border-radius:14px;border:1px solid rgba(120,130,255,.25);background:#000}
.lecture{border:1px solid rgba(120,130,255,.18);border-radius:16px;padding:18px;margin-bottom:14px;background:rgba(10,14,26,.6);transition:border-color .15s}
.lecture:hover{border-color:rgba(129,140,248,.45)}
.lecture h3{color:#a5b0f8;margin-bottom:6px;font-size:17px}
.paynum{font-size:28px;font-weight:900;color:#4ade80;letter-spacing:3px;direction:ltr;text-align:center;background:#0a0e1a;padding:12px;border-radius:12px;margin:12px 0;border:1px solid rgba(74,222,128,.3)}
.center{text-align:center}
a{color:#818cf8;font-weight:700}
.small{font-size:13px;color:#a3aac4}
.hidden{display:none}
.hero{border-radius:20px;padding:28px;margin-top:22px;background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(16,185,129,.14));border:1px solid rgba(129,140,248,.3)}
.hero h2{font-size:22px;font-weight:900;margin-bottom:10px}
.hero ul{margin:10px 22px 0;line-height:2;font-size:15px;color:#cdd3e8}
.stat{display:inline-block;background:rgba(10,14,26,.7);border:1px solid rgba(120,130,255,.25);border-radius:12px;padding:8px 16px;margin:4px;font-size:14px;font-weight:700;color:#c7cdfb}
</style>
</head>
<body>
<header>
  <h1>Ahmed <span>walid</span> | منصة الدورات</h1>
  <div>
    <span id="whoami" class="small"></span>
    <button id="logoutBtn" class="btn ghost hidden" onclick="logout()">تسجيل الخروج</button>
  </div>
</header>
<div class="wrap" id="app"></div>

<script>
const SUPABASE_URL = 'https://ynlyugdjbncerwemyihg.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubHl1Z2RqYm5jZXJ3ZW15aWhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MDQyODUsImV4cCI6MjExMTI4MDI4NX0._1lOk-j8DnP_SyQlQGqEYC1LLZbgh9RAvmwwRHLyifQ';
const ADMIN_EMAIL = 'walidamen087@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const app = document.getElementById('app');
const h = s => { const d=document.createElement('div'); d.innerText=s==null?'':String(s); return d.innerHTML; };
function setMsg(m){ app.innerHTML = m; }
function msgBox(t, kind){ return `<div class="msg ${kind}">${t}</div>`; }
async function getSession(){ const { data } = await sb.auth.getSession(); return data.session; }
function isAdmin(user){ return user && user.email === ADMIN_EMAIL; }
function v(id){ return document.getElementById(id).value.trim(); }
function m(id, html){ document.getElementById(id).innerHTML = html; }

function courseHero(){
  return `<div class="hero">
    <h2>🎨 دورة أساسيات برنامج فوتوشوب</h2>
    <div>
      <span class="stat">📅 أربع جلسات مباشرة عبر Zoom</span>
      <span class="stat">🕗 كل جمعة من 8:00 إلى 9:30 مساءً</span>
      <span class="stat">💳 الرسوم: 1300 جنيه مصري</span>
      <span class="stat">🎓 مشروع ختامي وشهادة إتمام</span>
    </div>
    <ul>
      <li>أساسيات البرنامج والتعامل مع الأدوات</li>
      <li>الطبقات (Layers) والتحديد والقص</li>
      <li>تعديل الصور وتحسينها وتصميم منشورات التواصل الاجتماعي</li>
      <li>تصميم المطبوعات والهوية البصرية وتنفيذ مشروع كامل بنفسك</li>
    </ul>
  </div>`;
}

function viewLogin(){
  setMsg(`
  ${courseHero()}
  <div class="card" style="max-width:460px;margin:26px auto">
    <h2 style="margin-bottom:18px">تسجيل الدخول</h2>
    <div id="m"></div>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" dir="ltr" placeholder="example@gmail.com">
    <label>كلمة المرور</label>
    <input id="pass" type="password" dir="ltr">
    <button class="btn" style="width:100%" onclick="doLogin()">دخول</button>
    <p class="small center" style="margin-top:16px">ليس لديك حساب بعد؟ <a href="#" onclick="viewSignup();return false">إنشاء حساب جديد</a></p>
  </div>`);
}
function viewSignup(){
  setMsg(`
  <div class="card" style="max-width:460px;margin:30px auto">
    <h2 style="margin-bottom:18px">إنشاء حساب جديد</h2>
    <div id="m"></div>
    <label>الاسم الكامل</label><input id="name">
    <label>رقم الهاتف</label><input id="phone" dir="ltr" placeholder="01xxxxxxxxx">
    <label>البريد الإلكتروني</label><input id="email" type="email" dir="ltr">
    <label>كلمة المرور</label><input id="pass" type="password" dir="ltr">
    <button class="btn" style="width:100%" onclick="doSignup()">إنشاء الحساب</button>
    <p class="small center" style="margin-top:16px">لديك حساب بالفعل؟ <a href="#" onclick="viewLogin();return false">تسجيل الدخول</a></p>
  </div>`);
}
async function doSignup(){
  const name=v('name'), phone=v('phone'), email=v('email'), pass=v('pass');
  if(!name||!email||!pass){ m('m', msgBox('يرجى إدخال الاسم والبريد الإلكتروني وكلمة المرور.','err')); return; }
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if(error){ m('m', msgBox(h(error.message),'err')); return; }
  await sb.from('students').insert({ id: data.user.id, full_name: name, phone, email });
  route();
}
async function doLogin(){
  const { error } = await sb.auth.signInWithPassword({ email: v('email'), password: v('pass') });
  if(error){ m('m', msgBox('البريد الإلكتروني أو كلمة المرور غير صحيحة.','err')); return; }
  route();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function viewStudent(user){
  const { data: st } = await sb.from('students').select('*').eq('id', user.id).single();
  const { data: en } = await sb.from('enrollments').select('*').eq('student_id', user.id).single();
  if(!en || en.status !== 'active'){
    const { data: reqs } = await sb.from('unlock_requests').select('*').eq('student_id', user.id).order('created_at',{ascending:false}).limit(1);
    const pending = reqs && reqs.length && reqs[0].status === 'pending';
    setMsg(`
    ${courseHero()}
    <div class="card" style="max-width:540px;margin:26px auto">
      <h2>مرحباً بك، ${h(st ? st.full_name : '')} 👋</h2>
      <p style="margin:12px 0">حالة الاشتراك: <span class="badge pending">قيد المراجعة</span></p>
      ${pending ? msgBox('تم استلام طلبك بنجاح، وسيتم تفعيل حسابك فور مراجعة عملية الدفع.','ok') : ''}
      <div class="card" style="background:rgba(10,14,26,.6)">
        <h3 style="margin-bottom:10px">💳 طريقة الدفع والاشتراك</h3>
        <p>رسوم الدورة: <b>1300 جنيه مصري</b></p>
        <p style="margin-top:10px">يرجى تحويل المبلغ عبر محفظة <b>اتصالات كاش</b> إلى الرقم التالي:</p>
        <div class="paynum">01143757857</div>
        <p class="small">بعد إتمام التحويل، أرسل اسمك ورقم هاتفك عبر واتساب، ثم اضغط على زر طلب التفعيل أدناه.</p>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn" onclick="requestUnlock()" ${pending?'disabled':''}>📩 طلب تفعيل الاشتراك</button>
          <a class="btn wa" target="_blank" href="https://wa.me/201143757857?text=${encodeURIComponent('أنا '+(st?st.full_name:'')+'، قمت بتحويل رسوم الدورة عبر اتصالات كاش. رقم هاتفي: '+(st&&st.phone?st.phone:''))}">تواصل عبر واتساب</a>
        </div>
      </div>
    </div>`);
    return;
  }
  const { data: lectures } = await sb.from('lectures').select('*').order('sort_order');
  let list = (lectures||[]).map((l,i)=>`
    <div class="lecture">
      <h3>${i+1}. ${h(l.title)}</h3>
      <p class="small">${h(l.description||'')}</p>
      <button class="btn ghost" style="margin-top:12px" onclick="playLecture(${l.id})">▶ مشاهدة المحاضرة</button>
      <div class="video-box hidden" id="vid-${l.id}"></div>
    </div>`).join('');
  if(!lectures || !lectures.length) list = msgBox('سيتم نشر المحاضرات هنا قريباً.','info');
  setMsg(`
  <div class="card">
    <h2>مرحباً بك، ${h(st ? st.full_name : '')} 👋</h2>
    <p style="margin:10px 0">حالة الاشتراك: <span class="badge active">مُفعَّل ✅</span></p>
  </div>
  <div class="card"><h2 style="margin-bottom:16px">📚 محاضرات الدورة</h2>${list}</div>`);
}
function playLecture(id){
  const box = document.getElementById('vid-'+id);
  sb.from('lectures').select('video_url').eq('id', id).single().then(({data})=>{
    if(!data) return;
    const u = data.video_url;
    const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    box.innerHTML = yt
      ? `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen allow="autoplay"></iframe>`
      : `<video controls preload="metadata" src="${h(u)}"></video>`;
    box.classList.remove('hidden');
  });
}
async function requestUnlock(){
  const { data: s } = await sb.auth.getSession();
  if(!s.session) return;
  const { data: st } = await sb.from('students').select('full_name').eq('id', s.session.user.id).single();
  const { error } = await sb.from('unlock_requests').insert({ student_id: s.session.user.id, sender_name: st ? st.full_name : '' });
  if(error){ alert('حدث خطأ، يرجى المحاولة مرة أخرى.'); return; }
  route();
}

async function viewAdmin(user){
  setMsg(`<div class="card"><h2>لوحة تحكم المدير 🛠️</h2><p class="small">جارٍ تحميل البيانات...</p></div>`);
  const { data: students } = await sb.from('students').select('*, enrollments(status)').order('created_at',{ascending:false});
  const { data: reqs } = await sb.from('unlock_requests').select('*').eq('status','pending').order('created_at',{ascending:false});
  const { data: lectures } = await sb.from('lectures').select('*').order('sort_order');
  const nameOf = id => { const s=(students||[]).find(x=>x.id===id); return s ? s.full_name : id.slice(0,8); };
  const reqRows = (reqs||[]).map(r=>`<tr>
    <td>${h(r.sender_name || nameOf(r.student_id))}</td>
    <td class="small">${new Date(r.created_at).toLocaleString('ar-EG')}</td>
    <td><button class="btn green" onclick="approve('${r.student_id}', ${r.id})">الموافقة ✅</button>
    <button class="btn red" onclick="rejectReq(${r.id})">رفض</button></td></tr>`).join('');
  const stRows = (students||[]).map(s=>{ const st=(s.enrollments&&s.enrollments.status)||'pending'; return `<tr>
    <td>${h(s.full_name)}</td><td class="small" dir="ltr">${h(s.email||'')}</td><td dir="ltr">${h(s.phone||'')}</td>
    <td><span class="badge ${st==='active'?'active':'pending'}">${st==='active'?'مُفعَّل':'قيد الانتظار'}</span></td>
    <td>${s.email===ADMIN_EMAIL?'':(st==='active'
      ? `<button class="btn red" onclick="setActive('${s.id}', false)">إيقاف</button>`
      : `<button class="btn green" onclick="setActive('${s.id}', true)">تفعيل</button>`)}</td></tr>`; }).join('');
  const lecRows = (lectures||[]).map(l=>`<tr><td>${l.sort_order}</td><td>${h(l.title)}</td><td><button class="btn red" onclick="delLecture(${l.id})">حذف</button></td></tr>`).join('');
  setMsg(`
  <div class="card">
    <h2 style="margin-bottom:14px">📩 طلبات التفعيل المعلّقة (${(reqs||[]).length})</h2>
    ${reqRows ? `<table><tr><th>الاسم</th><th>التاريخ</th><th></th></tr>${reqRows}</table>` : '<p class="small">لا توجد طلبات معلّقة حالياً.</p>'}
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">👥 قائمة الطلاب (${(students||[]).length})</h2>
    <table><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>رقم الهاتف</th><th>الحالة</th><th></th></tr>${stRows}</table>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">➕ إضافة محاضرة جديدة</h2>
    <div id="m"></div>
    <label>عنوان المحاضرة</label><input id="ltitle">
    <label>الوصف</label><input id="ldesc">
    <label>رابط الفيديو (رابط يوتيوب أو رابط mp4 مباشر)</label><input id="lurl" dir="ltr">
    <label>الترتيب</label><input id="lorder" type="number" dir="ltr" value="${(lectures||[]).length+1}">
    <button class="btn" onclick="addLecture()">إضافة المحاضرة</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">📚 المحاضرات الحالية</h2>
    ${lecRows ? `<table><tr><th>#</th><th>العنوان</th><th></th></tr>${lecRows}</table>` : '<p class="small">لم تتم إضافة محاضرات بعد.</p>'}
  </div>`);
}
async function approve(sid, rid){
  await sb.from('enrollments').upsert({ student_id: sid, status: 'active', approved_at: new Date().toISOString() });
  await sb.from('unlock_requests').update({ status: 'approved' }).eq('id', rid);
  route();
}
async function rejectReq(rid){ await sb.from('unlock_requests').update({ status: 'rejected' }).eq('id', rid); route(); }
async function setActive(sid, on){
  await sb.from('enrollments').upsert({ student_id: sid, status: on ? 'active' : 'pending', approved_at: on ? new Date().toISOString() : null });
  route();
}
async function addLecture(){
  const t=v('ltitle'), u=v('lurl');
  if(!t||!u){ m('m', msgBox('يرجى إدخال عنوان المحاضرة ورابط الفيديو.','err')); return; }
  const { error } = await sb.from('lectures').insert({ title: t, description: v('ldesc'), video_url: u, sort_order: parseInt(v('lorder'))||0 });
  if(error){ m('m', msgBox(h(error.message),'err')); return; }
  route();
}
async function delLecture(id){ if(!confirm('هل أنت متأكد من حذف هذه المحاضرة؟')) return; await sb.from('lectures').delete().eq('id', id); route(); }

async function route(){
  const s = await getSession();
  document.getElementById('logoutBtn').classList.toggle('hidden', !s);
  document.getElementById('whoami').innerText = s ? s.user.email : '';
  if(!s){ viewLogin(); return; }
  if(isAdmin(s.user)){ viewAdmin(s.user); } else { viewStudent(s.user); }
}
route();
</script>
</body>
</html>
