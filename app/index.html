function normPhone(x){ return String(x||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g,''); }
async function doSignup(){
  let name=v('name'), phone=v('phone'), email=v('email'), pass=v('pass');
  if(!name||!email||!pass||!phone){ m('m', msgBox('املأ الاسم ورقم الموبايل والإيميل وكلمة السر','err')); return; }
  if(!/^01[0125][0-9]{8}$/.test(normPhone(phone))){ m('m', msgBox('رقم الموبايل لازم يكون رقم مصري صحيح (11 رقم بيبدأ بـ 01)','err')); return; }
  if(pass.length<6){ m('m', msgBox('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل','err')); return; }
  phone = normPhone(phone);
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if(error){
    const t=(error.message||'').toLowerCase();
    m('m', msgBox(t.includes('already')?'الإيميل ده متسجل قبل كده. جرّب تسجيل الدخول أو "نسيت كلمة السر".':t.includes('password')?'كلمة السر لازم تكون 6 حروف أو أرقام على الأقل':t.includes('rate')?'محاولات كتير، استنى شوية وجرّب تاني':t.includes('invalid')?'اكتب إيميل صحيح':'حصل خطأ في التسجيل، جرّب تاني','err')); return; }
  if(!data.session){ m('m', msgBox('الإيميل ده متسجل قبل كده. جرّب تسجيل الدخول أو "نسيت كلمة السر".','err')); return; }
  const ins = await sb.from('students').insert({ id: data.user.id, full_name: name, phone, email });
  if(ins.error){ m('m', msgBox('الحساب اتعمل بس حصل خطأ في حفظ البيانات. اعمل تسجيل دخول وكلّم أحمد لو المشكلة فضلت.','err')); }
  route();
}

async function sendForgot(){
  const email=v('femail').toLowerCase(), phone=normPhone(v('fphone'));
  if(!email||!/^01[0125][0-9]{8}$/.test(phone)){ m('m', msgBox('اكتب الإيميل ورقم موبايل مصري صحيح','err')); return; }
  const { error } = await sb.from('password_reset_requests').insert({ email, phone });
  if(error){ m('m', msgBox('حصل خطأ، جرّب تاني','err')); return; }
  m('m', msgBox('طلبك وصل ✅ أحمد هيبعتلك كلمة سر مؤقتة على واتساب على الرقم ده في أقرب وقت.','ok'));
}
async function doLogin(){
  const em=v('email').toLowerCase(), pw=document.getElementById('pass').value;
  let { error } = await sb.auth.signInWithPassword({ email: em, password: pw.trim() });
  if(error && pw!==pw.trim()) ({ error } = await sb.auth.signInWithPassword({ email: em, password: pw }));
  if(error){ const t=(error.message||'').toLowerCase();
    m('m', msgBox(t.includes('rate')?'محاولات كتير، استنى شوية وجرّب تاني':t.includes('invalid login')||t.includes('credentials')?'الإيميل أو كلمة السر غلط. دوس "إظهار كلمة السر" وراجع اللي كتبته، أو دوس "نسيت كلمة السر؟".':'حصل خطأ، جرّب تاني','err')); return; }
  route();
}

  <div class="card"><h3 style="margin-bottom:12px">🎬 فيديو تعريفي عن الكورس</h3><div class="video-box" id="freeBox"></div></div>`);

async function viewStudent(user){

      ${pending ? msgBox('طلبك وصل ✅ هيتم تفعيل حسابك بعد مراجعة الدفع.','ok') : ''}

        <h3 style="margin-bottom:10px">💳 طريقة الدفع والاشتراك</h3>
        <p>سعر الكورس: <b>1300 جنيه</b></p>
        <p style="margin-top:10px">حوّل المبلغ على <b>اتصالات كاش</b> على الرقم:</p>
        <div class="paynum">01143757857</div>

          <a class="btn wa" target="_blank" href="https://wa.me/201143757857?text=${encodeURIComponent('أنا '+(st?st.full_name:'')+'، حولت اشتراك الكورس على اتصالات كاش. رقمي: '+(st&&st.phone?st.phone:''))}">واتساب</a>

  if(studentView==='home'){

    ${freeCard()}
    ${courseHero(`<div style="margin-top:16px"><span class="badge active">مشترك مفعّل ✅</span><div style="margin-top:14px"><button class="btn" id="enterCourseBtn" onclick="enterCourse()">▶ الدخول للكورس</button></div></div>`)}
    ${pwCard()}`);

  }

    <div class="lecture">
      <h3>${i+1}. ${h(l.title)}</h3>

  setMsg(`
  <div class="card">
    <h2>أهلاً ${h(st ? st.full_name : '')} 👋</h2>
    <p style="margin:10px 0">حالة الاشتراك: <span class="badge active">مفعّل ✅</span></p>
    <button class="btn ghost" onclick="goHome()">← رجوع لصفحة الكورس</button>

async function playLecture(id){
  const box = document.getElementById('vid-'+id);
  const { data } = await sb.from('lectures').select('video_url').eq('id', id).single();
  if(!data) return;
  const u = data.video_url;
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt){
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen allow="autoplay"></iframe>`;
  } else if(/^https?:\/\//.test(u)){
    box.innerHTML = `<video controls preload="metadata" src="${h(u)}"></video>`;
  } else {
    const { data: s, error } = await sb.storage.from('lectures').createSignedUrl(u, 3600);
    if(error || !s){ box.innerHTML = msgBox('حصلت مشكلة في تحميل الفيديو، جرّب تاني.','err'); box.classList.remove('hidden'); return; }
    box.innerHTML = `<video controls preload="metadata" src="${h(s.signedUrl)}"></video>`;
  }
  box.classList.remove('hidden');
}
async function requestUnlock(){
  const { data: s } = await sb.auth.getSession();
  if(!s.session) return;
  const { data: st } = await sb.from('students').select('full_name').eq('id', s.session.user.id).single();
  const { error } = await sb.from('unlock_requests').insert({ student_id: s.session.user.id, sender_name: st ? st.full_name : '' });
  if(error){ alert('حصل خطأ، جرب تاني'); return; }
  route();
}

    <td dir="ltr">${h(r.phone)} ${st?(match?'✅ نفس رقم التسجيل':'⚠️ مختلف عن رقم التسجيل ('+h(st.phone||'-')+')'):''}</td>
    <td>${st?`<button class="btn green" onclick="makeTempPassword(${r.id},'${st.id}','${h(r.phone)}')">كلمة سر مؤقتة</button>`:''} <button class="btn red" onclick="dismissReset(${r.id})">تجاهل</button></td></tr>`; }).join('');
  const stRows = (students||[]).map(s=>{ const st=(s.enrollments&&s.enrollments.status)||'pending'; return `<tr>
    <td>${h(s.full_name)}</td><td class="small" dir="ltr">${h(s.email||'')}</td><td dir="ltr">${h(s.phone||'')}</td>
    <td><span class="badge ${st==='active'?'active':'pending'}">${st==='active'?'مفعّل':'منتظر'}</span></td>
    <td style="white-space:nowrap">${s.email===ADMIN_EMAIL?'<span class="small">الأدمن</span>':`
      <button class="btn green" ${st==='active'?'disabled':''} onclick="setActive('${s.id}', true)">تفعيل</button>
      <button class="btn ghost" ${st==='active'?'':'disabled'} onclick="setActive('${s.id}', false)">إلغاء التفعيل</button>
      <button class="btn red" onclick="deleteStudent('${s.id}','${h(s.full_name).replace(/'/g,'')}')">حذف الحساب</button>`}</td></tr>`; }).join('');
  const lecRows = (lectures||[]).map(l=>`<tr><td>${l.sort_order}</td><td>${h(l.title)}</td><td><button class="btn red" onclick="delLecture(${l.id})">حذف</button></td></tr>`).join('');
  const courseList = (lectures||[]).map((l,i)=>`
    <div class="lecture">
      <h3>${i+1}. ${h(l.title)}</h3>
      <p class="small">${h(l.description||'')}</p>
      <button class="btn" style="margin-top:12px" onclick="playLecture(${l.id})">▶ شغّل الفيديو</button>
      <div class="video-box hidden" id="vid-${l.id}"></div>
    </div>`).join('') || '<p class="small">المحاضرات هتتضاف قريبا</p>';
  setMsg(`
  <div class="card" id="courseCard">
    <h2 style="margin-bottom:14px">🎬 معاينة الأدمن</h2>
    <div class="lecture"><h3>🎁 الكورس التعريفي المجاني</h3><p class="small">فيديو الشرح، متاح لأي حد عامل حساب.</p>
      <button class="btn" style="margin-top:12px" onclick="playFree('vid-free')">▶ شغّل الفيديو التعريفي</button><div class="video-box hidden" id="vid-free"></div></div>
    <h3 style="margin:18px 0 10px">📚 محاضرات الكورس الأساسي (مدفوع)</h3>
    ${courseList}
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">📩 طلبات التفعيل (${(reqs||[]).length})</h2>
    ${reqRows ? `<table><tr><th>الاسم</th><th>التاريخ</th><th></th></tr>${reqRows}</table>` : '<p class="small">مفيش طلبات منتظرة.</p>'}
  </div>
  <div class="card" id="resetCard">
    <h2 style="margin-bottom:14px">🔓 طلبات نسيان كلمة السر (${(resets||[]).length})</h2>
    <div id="tempbox"></div>
    ${resetRows ? `<table><tr><th>الاسم</th><th>الإيميل</th><th>الموبايل</th><th></th></tr>${resetRows}</table>` : '<p class="small">مفيش طلبات.</p>'}
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">👥 الطلاب (${(students||[]).length})</h2>
    <table><tr><th>الاسم</th><th>الإيميل</th><th>الموبايل</th><th>الحالة</th><th></th></tr>${stRows}</table>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">🔑 تغيير كلمة سر الأدمن</h2>
    <div id="pwmsg"></div>
    <label>كلمة السر الجديدة</label><input id="newpass" type="password" dir="ltr" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"><label class="small" style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" style="width:auto;margin:0" onchange="document.getElementById('newpass').type=this.checked?'text':'password'"> إظهار كلمة السر</label>
    <button class="btn" onclick="changeAdminPassword()">حفظ كلمة السر</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">➕ إضافة محاضرة</h2>
    <div id="m"></div>

    <label>الوصف</label><input id="ldesc">
    <label>ارفع ملف الفيديو (mp4، لحد 50 ميجا)</label><input id="lfile" type="file" accept="video/mp4,video/*">
    <label>أو رابط يوتيوب (غير مدرج / Unlisted) بدل الرفع</label><input id="lurl" dir="ltr" placeholder="https://youtu.be/...">
    <label>الترتيب</label><input id="lorder" type="number" dir="ltr" value="${(lectures||[]).length+1}">
    <button class="btn" onclick="addLecture()">إضافة</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:14px">📚 المحاضرات الحالية</h2>
    ${lecRows ? `<table><tr><th>#</th><th>العنوان</th><th></th></tr>${lecRows}</table>` : '<p class="small">مفيش محاضرات لسه.</p>'}

async function approve(sid, rid){
  await sb.from('enrollments').upsert({ student_id: sid, status: 'active', approved_at: new Date().toISOString() });
  await sb.from('unlock_requests').update({ status: 'approved' }).eq('id', rid);
  route();
}
async function rejectReq(rid){ await sb.from('unlock_requests').update({ status: 'rejected' }).eq('id', rid); route(); }
async function makeTempPassword(rid, sid, phone){
  const chars='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a=new Uint32Array(10); crypto.getRandomValues(a);
  const pw=[...a].map(x=>chars[x%chars.length]).join('');
  const { error } = await sb.rpc('admin_set_student_password', { target: sid, new_password: pw });
  if(error){ alert('حصل خطأ: '+error.message); return; }
  await sb.from('password_reset_requests').update({ status:'done' }).eq('id', rid);
  const intl='2'+phone;
  const txt='أهلاً، دي كلمة السر المؤقتة بتاعتك على منصة Ahmed walid: '+pw+'\nادخل بيها وغيّرها من صفحتك (تغيير كلمة السر).';
  document.getElementById('tempbox').innerHTML = `<div class="msg ok">كلمة السر المؤقتة: <b dir="ltr" style="font-size:22px;letter-spacing:2px">${pw}</b><br><a class="btn wa" target="_blank" href="https://wa.me/${intl}?text=${encodeURIComponent(txt)}">ابعتها للطالب على واتساب</a></div>`;
}
async function dismissReset(rid){ await sb.from('password_reset_requests').update({ status:'done' }).eq('id', rid); route(); }
async function deleteStudent(sid, name){
  if(!confirm('متأكد إنك عايز تمسح حساب «'+name+'» نهائي؟ هيتمسح الحساب وكل طلباته، وهيقدر يسجل من جديد بنفس الإيميل. مفيش رجوع.')) return;
  const { error } = await sb.rpc('admin_delete_student', { target: sid });
  if(error){ alert('حصل خطأ: '+error.message); return; }
  route();
}
async function changeAdminPassword(){
  const p1=document.getElementById('newpass').value;
  if(p1.length<8){ m('pwmsg', msgBox('كلمة السر لازم تكون 8 حروف على الأقل','err')); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ m('pwmsg', msgBox(h(error.message),'err')); return; }
  document.getElementById('newpass').value='';
  m('pwmsg', msgBox('تم تغيير كلمة السر ✅','ok'));
}
async function setActive(sid, on){
  await sb.from('enrollments').upsert({ student_id: sid, status: on ? 'active' : 'pending', approved_at: on ? new Date().toISOString() : null });
  route();
}
async function addLecture(){
  const t=v('ltitle'), u=v('lurl');
  const f=document.getElementById('lfile').files[0];
  if(!t || (!u && !f)){ m('m', msgBox('اكتب العنوان وارفع ملف الفيديو (أو حط رابط يوتيوب)','err')); return; }
  let videoUrl = u;
  if(f){
    if(f.size > 50*1024*1024){ m('m', msgBox('الملف أكبر من 50 ميجا. صغّره أو ارفعه على يوتيوب (غير مدرج) وحط الرابط.','err')); return; }
    m('m', msgBox('جاري رفع الفيديو... متقفلش الصفحة','info'));
    const ext = (f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'') || 'mp4';
    const path = 'lec-' + Date.now() + '.' + ext;
    const up = await sb.storage.from('lectures').upload(path, f, { contentType: f.type || 'video/mp4', upsert: false });
    if(up.error){ m('m', msgBox('فشل الرفع: '+h(up.error.message),'err')); return; }
    videoUrl = path;
  }
  const { error } = await sb.from('lectures').insert({ title: t, description: v('ldesc'), video_url: videoUrl, sort_order: parseInt(v('lorder'))||0 });
  if(error){ m('m', msgBox(h(error.message),'err')); return; }
  route();
}
async function delLecture(id){ if(!confirm('متأكد من حذف المحاضرة؟')) return; const { data: l } = await sb.from('lectures').select('video_url').eq('id', id).single(); await sb.from('lectures').delete().eq('id', id); if(l && l.video_url && !/^https?:\/\//.test(l.video_url)) await sb.storage.from('lectures').remove([l.video_url]); route(); }

async function route(){
  const s = await getSession();
  document.getElementById('logoutBtn').classList.toggle('hidden', !s);
  document.getElementById('whoami').innerText = s ? s.user.email : '';
  if(!s){ viewLogin(); return; }
  if(isAdmin(s.user)){ viewAdmin(s.user); } else { viewStudent(s.user); }
}
route();
</script>
