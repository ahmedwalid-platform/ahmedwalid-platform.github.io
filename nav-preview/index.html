async function saveProfile(uid){
  const name=v('pname'), phone=normPhone(v('pphone')), guard=normPhone(v('pguard')), age=parseInt(normPhone(v('page')));
  if(name.length<2){ m('pm', msgBox('اكتب اسمك','err')); return; }
  if(!/^01[0125][0-9]{8}$/.test(phone)){ m('pm', msgBox('رقم موبايلك لازم يكون رقم مصري صحيح (11 رقم بيبدأ بـ 01)','err')); return; }
  if(guard && !/^01[0125][0-9]{8}$/.test(guard)){ m('pm', msgBox('رقم ولي الأمر لازم يكون رقم مصري صحيح','err')); return; }
  if(v('page') && !(age>=5 && age<=100)){ m('pm', msgBox('السن لازم يكون بين 5 و 100','err')); return; }
  const upd = { full_name: name, phone, guardian_phone: guard||null, governorate: document.getElementById('pgov').value||null, address: v('paddr')||null, age: isNaN(age)?null:age };
  const f=document.getElementById('pphoto').files[0];
  if(f){
    if(!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size>2*1024*1024){ m('pm', msgBox('الصورة لازم تكون jpg أو png وأقل من 2 ميجا','err')); return; }
    try{ const blob=await resizeImage(f); const path=uid+'/avatar.jpg';
      const { error:ue } = await sb.storage.from('avatars').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
      if(ue){ m('pm', msgBox('الصورة ما اترفعتش، جرّب تاني','err')); return; }
      upd.photo_path = path; }catch(e){ m('pm', msgBox('مقدرتش أقرأ الصورة، جرّب صورة تانية','err')); return; }
  }
  const { error } = await sb.from('students').update(upd).eq('id', uid);
  if(error){ m('pm', msgBox('حصل خطأ في الحفظ، راجع البيانات وجرّب تاني','err')); return; }
  window._pedit=false; studentView = document.querySelector('#tabs.scroll') ? 'home' : 'profile'; if(document.querySelector('#tabs.scroll')) curTab='profile'; await route();
}

function normPhone(x){ return String(x||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g,''); }
async function doSignup(){
  let name=v('name'), phone=v('phone'), email=v('email'), pass=v('pass');
  if(!name||!email||!pass||!phone){ m('m', msgBox('املأ الاسم ورقم الموبايل والإيميل وكلمة السر','err')); return; }
  if(!/^01[0125][0-9]{8}$/.test(normPhone(phone))){ m('m', msgBox('رقم الموبايل لازم يكون رقم مصري صحيح (11 رقم بيبدأ بـ 01)','err')); return; }
  if(pass.length<6){ m('m', msgBox('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل','err')); return; }
  phone = normPhone(phone);
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  if(error){
    const t=(error.message||'').toLowerCase();
    m('m', msgBox(t.includes('already')?'الإيميل ده متسجل قبل كده. جرّب تسجيل الدخول أو "نسيت كلمة السر".':t.includes('password')?'كلمة السر لازم تكون 6 حروف أو أرقام على الأقل':t.includes('rate')?'محاولات كتير، استنى شوية وجرّب تاني':t.includes('invalid')?'اكتب إيميل صحيح':'حصل خطأ في التسجيل، جرّب تاني','err')); return; }
  if(!data.session){ m('m', msgBox('الإيميل ده متسجل قبل كده. جرّب تسجيل الدخول أو "نسيت كلمة السر".','err')); return; }
  const ins = await sb.from('students').insert({ id: data.user.id, full_name: name, phone, email });
  if(ins.error){ m('m', msgBox('الحساب اتعمل بس حصل خطأ في حفظ البيانات. اعمل تسجيل دخول وكلّم أحمد لو المشكلة فضلت.','err')); }
  route();
}

let _rBusy=false;
async function doResetCode(){
  if(_rBusy) return;
  const email=v('remail').toLowerCase(), code=normPhone(v('rcode')), p1=document.getElementById('rpass').value, p2=document.getElementById('rpass2').value;
  if(!email||!/^[0-9]{8}$/.test(code)){ m('m', msgBox('اكتب الإيميل والكود (8 أرقام)','err')); return; }
  if(p1.length<8){ m('m', msgBox('كلمة السر لازم تكون 8 حروف أو أكتر','err')); return; }
  if(p1!==p2){ m('m', msgBox('كلمتين السر مش زي بعض','err')); return; }
  _rBusy=true; const b=document.getElementById('resetBtn'); b.disabled=true; b.textContent='جاري التغيير...';
  const { data, error } = await sb.rpc('reset_password_with_code', { p_email: email, p_code: code, p_new: p1 });
  _rBusy=false; b.disabled=false; b.textContent='تغيير كلمة السر';
  if(error){ m('m', msgBox('حصل خطأ، جرّب تاني','err')); return; }
  if(data==='ok'){ viewLogin().then(()=>m('m', msgBox('كلمة السر اتغيرت ✅ دخّل بكلمة السر الجديدة.','ok'))); return; }
  if(data==='weak'){ m('m', msgBox('كلمة السر لازم تكون 8 حروف أو أكتر','err')); return; }
  m('m', msgBox('الإيميل أو الكود غلط أو الكود انتهى. اطلب كود جديد من أحمد.','err'));
}

async function sourceHtml(u){
  if(!u) return '';
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}?rel=0&modestbranding=1&enablejsapi=1" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
  const gd = u.match(/(?:drive|docs)\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/);
  if(gd) return `<iframe src="https://drive.google.com/file/d/${gd[1]}/preview" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
  if(/^https?:\/\//.test(u)) return `<video controls preload="metadata" src="${h(u)}"></video>`;
  const { data: s2, error } = await sb.storage.from('lectures').createSignedUrl(u, 3600);
  if(error || !s2) return '';
  return `<video controls preload="metadata" src="${h(s2.signedUrl)}"></video>`;
}

function csvCell(x){ if(x==null) return ''; x=String(x); if(/^[=+\-@]/.test(x)) x="'"+x; return '"'+x.replace(/"/g,'""')+'"'; }
function dlCsv(name, rows){ const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
async function fetchAll(tbl, sel, order){ let out=[],from=0; for(;;){ const { data, error } = await sb.from(tbl).select(sel).order(order,{ascending:true}).range(from,from+999); if(error) throw error; out=out.concat(data||[]); if(!data||data.length<1000) break; from+=1000; } return out; }

async function uploadOrLink(fileId, urlId, tag){
  const u=v(urlId); const f=document.getElementById(fileId).files[0];
  if(f){
    if(f.size > 50*1024*1024) return { err:'الملف أكبر من 50 ميجا. ارفعه على يوتيوب (غير مدرج) أو جوجل درايف وحط الرابط.' };
    const ext = (f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'') || 'mp4';
    const path = 'lec-' + tag + '-' + Date.now() + '.' + ext;
    const up = await sb.storage.from('lectures').upload(path, f, { contentType: f.type || 'video/mp4', upsert: false });
    if(up.error) return { err:'فشل الرفع: '+h(up.error.message) };
    return { val: path };
  }
  return { val: u || null };
}

  const s1 = await uploadOrLink('lfile','lurl','s1'); if(s1.err){ m('m', msgBox(s1.err,'err')); return; }
  const s2 = await uploadOrLink('lfile2','lurl2','s2'); if(s2.err){ m('m', msgBox(s2.err,'err')); return; }
  let durSec = Math.round(parseFloat(v('ldur')||'0')*60)||null;
  const f1=document.getElementById('lfile').files[0];
  if(!durSec && f1){ durSec = await new Promise(r=>{ const vv=document.createElement('video'); vv.preload='metadata'; vv.onloadedmetadata=()=>r(Math.round(vv.duration)||null); vv.onerror=()=>r(null); vv.src=URL.createObjectURL(f1); setTimeout(()=>r(null),8000); }); }
  const { error } = await sb.from('lectures').insert({ title: t, description: v('ldesc'), video_url: s1.val, video_url2: s2.val, sort_order: parseInt(v('lorder'))||0, duration_sec: durSec, max_views: Math.max(0, isNaN(parseInt(v('lmaxv')))?5:parseInt(v('lmaxv'))) });

  await alog_('إضافة محاضرة','-',t);
  route();
}

async function doInstall(){ if(_ip){ _ip.prompt(); try{ await _ip.userChoice; }catch(e){} _ip=null; const c=document.getElementById('installCard'); if(c) c.remove(); } else showInstallSteps(); }
async function route(){ showLoader(); try{ return await _route(); } finally{ hideLoader(); maybeInstallHint(); } }
async function _route(){
  const s = await getSession();
  document.getElementById('logoutBtn').classList.toggle('hidden', !s);
  document.getElementById('whoami').innerText = (s && isAdmin(s.user)) ? 'أحمد وليد' : '';
  if(location.hash==='#faq'){ renderTabs(''); viewFaq(!!s); return; }
  if(!s){ renderTabs(''); document.getElementById('bell').classList.add('hidden'); if(localStorage.getItem('aw_promo')) viewSignup(); else await viewLogin(); return; }
  if(isAdmin(s.user)){ if(window._asStudent){ asBar(); return viewStudent(s.user); } asBarOff(); return viewAdmin(s.user,'main'); }
  startPresence();
  const { data: sf } = await sb.from('staff').select('user_id').eq('user_id', s.user.id).maybeSingle();
  if(sf){ document.getElementById('whoami').innerText=s.user.email; try{ const { data: hm } = await sb.from('students').select('full_name').eq('id', s.user.id).maybeSingle(); if(hm&&hm.full_name) document.getElementById('whoami').innerText=hm.full_name; }catch(e){} return viewAdmin(s.user,'helper'); }
  { const { data: me0 } = await sb.from('students').select('full_name').eq('id', s.user.id).maybeSingle(); if(me0&&me0.full_name) document.getElementById('whoami').innerText=me0.full_name; }
  return viewStudent(s.user);
}

function promoRemain(exp){ const ms=new Date(exp)-Date.now(); if(ms<=0) return null; const d=Math.floor(ms/86400000), hr=Math.floor((ms%86400000)/3600000), mi=Math.floor((ms%3600000)/60000); return d>0?`${d} يوم و ${hr} ساعة`:(hr>0?`${hr} ساعة و ${mi} دقيقة`:`${mi} دقيقة`); }

  document.body.appendChild(ov);
  document.getElementById('cpIn').addEventListener('input',()=>{ if(window._coupon){ window._coupon=null; showPrice(); document.getElementById('cpMsg').innerHTML=''; } });
  try{ const { data } = await sb.rpc('promo_my'); if(data&&data.ok&&!data.used&&!data.ended&&!data.expired){ document.getElementById('cpIn').value=data.code; applyCoupon(); } }catch(e){}

function showPrice(){ const c=window._course||{price:COURSE_PRICE}; const p=document.getElementById('buyPrice'); const k=window._coupon; if(!p) return; p.innerHTML = k ? `💳 <s style="opacity:.6">${fmtMoney(c.price)}</s> <b style="color:#4ade80">${fmtMoney(k.final)} جنيه</b>` : `💳 ${fmtMoney(c.price)} جنيه`; const hw=document.getElementById('buyHow'); if(hw) hw.innerText = k ? `هيتخصم ${fmtMoney(k.final)} جنيه من رصيد محفظتك (بعد الخصم) والكورس هيتفتحلك على طول.` : 'هيتخصم من رصيد محفظتك والكورس هيتفتحلك على طول.'; }
const CP_ERR={invalid:'الكود ده مش صح.',expired:'الكود ده انتهت مدته.',maxed:'الكود ده خلصت مرات استخدامه.',used:'انت استخدمت الكود ده قبل كده.',too_many:'محاولات كتير، استنى شوية وجرّب تاني.'};
async function applyCoupon(){
  const code=(document.getElementById('cpIn').value||'').trim(); const box=document.getElementById('cpMsg'); if(!code){ box.innerHTML=msgBox('اكتب الكود الأول','err'); return; }
  const b=document.getElementById('cpBtn'); b.disabled=true;
  const { data, error } = await sb.rpc('coupon_check',{p_code:code,p_course:'photoshop'}); b.disabled=false;
  if(error||!data){ box.innerHTML=msgBox('حصل خطأ، جرّب تاني.','err'); return; }
  if(!data.ok){ window._coupon=null; showPrice(); box.innerHTML=msgBox(CP_ERR[data.reason]||'الكود مش صالح.','err'); return; }
  window._coupon={code:data.code,final:Number(data.final),discount:Number(data.discount)}; showPrice();
  box.innerHTML=msgBox(`✅ الكود شغال. خصم ${fmtMoney(data.discount)} جنيه${data.percent?` (${data.percent}%)`:''}.`,'ok');
}
async function confirmBuy(){
  if(_buying) return; _buying=true;
  const y=document.getElementById('buyYes'), n=document.getElementById('buyNo');
  if(y){ y.disabled=true; y.textContent='جاري الشراء...'; } if(n) n.disabled=true;
  const { data, error } = await sb.rpc('buy_course_v2', { course: 'photoshop', p_coupon: window._coupon?window._coupon.code:null });
  _buying=false;
  const box=document.getElementById('buyModalMsg');
  if(error){ if(box) box.innerHTML=msgBox('حصل خطأ، جرّب تاني. ماتخصمش منك حاجة.','err'); if(y){y.disabled=false;y.textContent='✅ أيوه، اشتري';} if(n) n.disabled=false; return; }
  if(typeof data==='string'&&data.indexOf('coupon_')===0){ window._coupon=null; showPrice(); if(box) box.innerHTML=msgBox((CP_ERR[data.slice(7)]||'الكود مش صالح.')+' ماتخصمش منك حاجة.','err'); if(y){y.disabled=false;y.textContent='✅ أيوه، اشتري';} if(n) n.disabled=false; return; }
  if(data==='insufficient'){
    if(box) box.innerHTML=msgBox('رصيدك مش كفاية لشراء الكورس. شحّن رصيدك الأول من تبويب "شحن الرصيد" وبعدها ارجع اشتري.','err');

    const bt=document.createElement('button'); bt.className='btn'; bt.textContent='💰 روح لشحن الرصيد'; bt.onclick=()=>{closeBuy();goTab('wallet');}; if(n) n.parentNode.prepend(bt);
    return;
  }
  closeBuy(); studentView='courses'; route();
}

async function uploadAsg(id){
  const f=document.getElementById('asgf-'+id).files[0]; const box=document.getElementById('asgm-'+id); const btn=document.getElementById('asgb-'+id);

function certDl(kind){
  if(!_certCv||!_cert) return; const fn='certificate-'+_cert.code;
  if(kind==='png'){ _certCv.toBlob(b=>dlBlob(b,fn+'.png'),'image/png'); return; }
  const b64=_certCv.toDataURL('image/jpeg',0.92).split(',')[1]; const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  dlBlob(makePdf(u8,_certCv.width,_certCv.height),fn+'.pdf');
}
function dlBlob(b,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }
function makePdf(jpg,w,hh){ const enc=s=>new TextEncoder().encode(s); const parts=[],offs=[]; let len=0; const add=b=>{ if(typeof b==='string') b=enc(b); parts.push(b); len+=b.length; };
  add('%PDF-1.4\n'); offs[1]=len; add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n'); offs[2]=len; add('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n'); offs[3]=len; add('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n');
  offs[4]=len; add(`4 0 obj<</Type/XObject/Subtype/Image/Width ${w}/Height ${hh}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>stream\n`); add(jpg); add('\nendstream endobj\n');
  const cs='q 842 0 0 595 0 0 cm /Im0 Do Q'; offs[5]=len; add(`5 0 obj<</Length ${cs.length}>>stream\n${cs}\nendstream endobj\n`);
  const xr=len; add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(i=>String(offs[i]).padStart(10,'0')+' 00000 n \n').join('')); add(`trailer<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`); return new Blob(parts,{type:'application/pdf'}); }

{promoRows?`<div style="overflow:auto"><table><tr><th>الطالب</th><th>الموبايل</th><th>الكود</th><th>الحالة</th><th>اتعمل</th><th>ينتهي</th></tr>${promoRows}</table></div>`:'<p class="small">لسه محدش سجّل بالينك.</p>'}

/* ===== quiz / required items ===== */
function lecReqs(l){
  if(!l.quiz_on && !l.asg_required) return '';
  const card=(ok,ic,t,st,btn)=>`<div style="flex:1 1 220px;min-width:0;padding:16px;border-radius:16px;background:linear-gradient(160deg,${ok?'rgba(16,185,129,.22),rgba(6,78,59,.35)':'rgba(251,191,36,.16),rgba(124,58,237,.22)'});border:2px solid ${ok?'#34d399':'#fbbf24'}"><div style="font-size:30px">${ic}</div><b style="display:block;margin:6px 0 4px;font-size:17px">${t}</b><p class="small" style="margin-bottom:10px">${st}</p>${btn||''}</div>`;
  if(!l.done) return `<div style="margin-top:14px;padding:14px;border-radius:14px;border:2px dashed rgba(148,163,184,.5)"><b>🔓 عشان تفتح المحاضرة اللي بعدها:</b><p class="small" style="margin-top:6px">خلّص مشاهدة الفيديو لآخره الأول، وبعدها هيظهرلك ${l.asg_required?'الواجب':''}${l.asg_required&&l.quiz_on?' و':''}${l.quiz_on?'الامتحان':''} كل واحد في كارت لوحده.</p></div>`;
  let cs=card(true,'🎬','الفيديو','تمت المشاهدة ✅','');
  if(l.asg_required){ const ok=l.asg_mode==='approved'?l.asg_approved:l.asg_count>0; const st=l.asg_mode==='approved'?(l.asg_approved?'أحمد وافق على الواجب ✅':(l.asg_count>0?'اترفع وفي انتظار موافقة أحمد ⏳':'لازم ترفعه وأحمد يوافق عليه')):(l.asg_count>0?'اترفع ✅':'لازم ترفعه'); cs+=card(ok,'📝','الواجب',st,ok?'':`<button class="btn" style="${_sty_sm}" onclick="toggleAsg(${l.id});setTimeout(()=>{const e=document.getElementById('asg-${l.id}');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},400)">${l.asg_count>0?'📂 افتح الواجب':'⬆️ ارفع الواجب'}</button>`); }
  if(l.quiz_on){ const ex=l.quiz_attempts>0&&l.quiz_used>=l.quiz_attempts&&!l.quiz_passed; const st=l.quiz_passed?`نجحت ✅ (${l.quiz_best}%)`:`النجاح من ${l.quiz_pass}%${l.quiz_best!=null?' · أعلى درجة: '+l.quiz_best+'%':''}${l.quiz_attempts>0?' · محاولات: '+l.quiz_used+' من '+l.quiz_attempts:''}`; cs+=card(l.quiz_passed,'📋','الامتحان',st,l.quiz_passed||ex?'':`<button class="btn" style="${_sty_sm}" onclick="toggleQuiz(${l.id})">${l.quiz_used>0?'🔄 حاول تاني':'▶ ابدأ الامتحان'}</button>`); }
  return `<div style="margin-top:14px"><b>🔓 المطلوب عشان تفتح المحاضرة اللي بعدها:</b><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px">${cs}</div><div id="quiz-${l.id}" class="hidden" style="margin-top:12px"></div></div>`;
}
async function toggleQuiz(id){ const el=document.getElementById('quiz-'+id); if(!el.classList.contains('hidden')){ el.classList.add('hidden'); return; } el.classList.remove('hidden'); el.innerHTML='<p class="small">جارِ التحميل...</p>'; const r=await sb.rpc('quiz_get',{p_lec:id}); const d=r.data; if(r.error||!d||!d.on){ el.innerHTML=msgBox('الامتحان مش متاح دلوقتي','err'); return; }
  if(d.passed){ el.innerHTML=msgBox('نجحت في الامتحان ✅','ok'); return; }
  if(d.attempts>0&&d.used>=d.attempts){ el.innerHTML=msgBox('خلصت محاولات الامتحان ('+d.attempts+'). كلّم أحمد على واتساب.','err'); return; }
  if(!(d.questions||[]).length){ el.innerHTML=msgBox('الامتحان لسه مفيهوش أسئلة','info'); return; }
  el.innerHTML=`<div class="card" style="margin:0"><h3>📋 الامتحان</h3><p class="small" style="margin:6px 0 10px">${d.questions.length} سؤال. النجاح من ${d.pass}%.${d.attempts>0?' المحاولات: '+d.used+' من '+d.attempts+' استخدمت.':''} جاوب كل الأسئلة وبعدين ابعت.</p>${d.questions.map((q,i)=>`<div style="margin:12px 0;padding:12px;border-radius:12px;background:rgba(10,14,26,.55)"><b>${i+1}. ${h(q.q)}</b>${q.o.map((o,j)=>`<label style="display:flex;gap:8px;align-items:center;margin-top:8px;cursor:pointer"><input type="radio" name="qz-${q.id}" value="${j}" style="width:auto;margin:0"> <span>${h(o)}</span></label>`).join('')}</div>`).join('')}<div id="qzm-${id}"></div><button class="btn" id="qzb-${id}" onclick="submitQuiz(${id})">✅ ابعت الإجابات</button></div>`; window._qzq=window._qzq||{}; window._qzq[id]=d.questions.map(q=>q.id); }
async function submitQuiz(id){ const ids=(window._qzq||{})[id]||[]; const ans={}; for(const q of ids){ const c=document.querySelector('input[name="qz-'+q+'"]:checked'); if(!c){ document.getElementById('qzm-'+id).innerHTML=msgBox('جاوب كل الأسئلة الأول','err'); return; } ans[q]=parseInt(c.value); }
  const b=document.getElementById('qzb-'+id); b.disabled=true; const r=await sb.rpc('quiz_submit',{p_lec:id,p_answers:ans}); const m=document.getElementById('qzm-'+id);
  if(r.error){ m.innerHTML=msgBox('حصل خطأ: '+h((r.error.message||'').slice(0,80)),'err'); b.disabled=false; return; }
  const d=r.data; m.innerHTML=d.passed?msgBox('🎉 نجحت! درجتك '+d.score+'% ('+d.correct+' من '+d.total+')','ok'):msgBox('درجتك '+d.score+'% ('+d.correct+' من '+d.total+'). النجاح من '+d.pass+'%.'+(d.attempts>0?' استخدمت '+d.used+' من '+d.attempts+' محاولات.':''),'err'); showReview(id,d.review); if(d.deactivated){ m.innerHTML+=msgBox('⛔ استخدمت المحاولات التلاتة في الامتحان النهائي ومنجحتش، فاشتراكك اتقفل. لو عايز تكمّل، ادفع سعر الكورس تاني (1300 جنيه أو أقل بكوبون خصم) وأحمد هيفتحلك الكورس من الأول والتقدم هيتصفّر.','err'); } b.textContent='🔄 تحديث'; b.disabled=false; b.onclick=()=>route(); }
async function adminApprove(id,ok){ const r=await sb.rpc('admin_assignment_approve',{p_id:id,p_ok:ok}); if(r.error){ alert('حصل خطأ'); return; } route(); }
window._qz=null;
async function qzOpen(){ const id=parseInt(document.getElementById('qzLec').value); const box=document.getElementById('qzBox'); if(!id){ box.innerHTML=''; return; } box.innerHTML='<p class="small">جارِ التحميل...</p>'; const r=await sb.rpc('admin_quiz_get',{p_lec:id}); if(r.error||!r.data){ box.innerHTML=msgBox('حصل خطأ','err'); return; } const d=r.data; window._qz={id,quiz_on:d.quiz_on,pass:d.pass,attempts:d.attempts,asg_required:d.asg_required,asg_mode:d.asg_mode,questions:(d.questions||[]).map(q=>({q:q.q,o:q.o.slice(),c:q.c,e:q.e||''}))}; try{ const fs=await sb.rpc('final_status'); window._qz.is_final=!!(fs.data&&fs.data.has_final&&fs.data.lecture_id===id); }catch(e){} qzRender(); }
function qzRender(){ const z=window._qz; if(!z) return; const box=document.getElementById('qzBox');
  const qs=z.questions.map((q,i)=>`<div style="margin:12px 0;padding:12px;border-radius:12px;background:rgba(10,14,26,.55);border:1px solid rgba(167,139,250,.4)"><div style="display:flex;justify-content:space-between;gap:8px"><b>سؤال ${i+1}</b><button class="btn ghost" style="${_sty_sm}" onclick="qzDelQ(${i})">🗑️</button></div><input value="${h(q.q)}" oninput="_qz.questions[${i}].q=this.value" placeholder="نص السؤال">${q.o.map((o,j)=>`<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="radio" name="qzc-${i}" ${q.c===j?'checked':''} onchange="_qz.questions[${i}].c=${j}" style="width:auto;margin:0" title="الإجابة الصح"><input value="${h(o)}" oninput="_qz.questions[${i}].o[${j}]=this.value" placeholder="اختيار ${j+1}" style="margin:0">${q.o.length>2?`<button class="btn ghost" style="${_sty_sm}" onclick="qzDelO(${i},${j})">✖</button>`:''}</div>`).join('')}${q.o.length<6?`<button class="btn ghost" style="margin-top:8px;${_sty_sm}" onclick="qzAddO(${i})">➕ اختيار</button>`:''}<p class="small" style="margin-top:6px">الدايرة المعلّمة = الإجابة الصح.</p><label style="margin-top:8px">💡 الشرح (بيظهر للطالب بعد ما يبعت إجاباته)</label><textarea rows="2" maxlength="2000" oninput="_qz.questions[${i}].e=this.value" placeholder="اشرح ليه ده الجواب الصح (اختياري)">${h(q.e||'')}</textarea></div>`).join('');
  box.innerHTML=`<div class="card" style="margin:0"><h3>⚙️ إعدادات المحاضرة</h3><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" ${z.quiz_on?'checked':''} onchange="_qz.quiz_on=this.checked" style="width:auto;margin:0"> <b>فيه امتحان (لازم النجاح عشان تفتح اللي بعدها)</b></label><label>نسبة النجاح %</label><input type="number" dir="ltr" min="1" max="100" value="${z.pass}" oninput="_qz.pass=parseInt(this.value)||70"><label>عدد المحاولات المسموحة (0 = بلا حد)</label><input type="number" dir="ltr" min="0" max="50" value="${z.is_final?3:z.attempts}" ${z.is_final?'disabled':''} oninput="_qz.attempts=parseInt(this.value)||0"><label style="display:flex;gap:8px;align-items:center;margin-top:12px;padding:10px;border-radius:12px;border:1px solid #f59e0b"><input type="checkbox" ${z.is_final?'checked':''} onchange="qzFinal(this.checked)" style="width:auto;margin:0"> <b>🏁 ده الامتحان النهائي (بيحدد الشهادة، 3 محاولات بالظبط، ولو الطالب استنفدها اشتراكه بيتقفل)</b></label><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" ${z.asg_required?'checked':''} onchange="_qz.asg_required=this.checked" style="width:auto;margin:0"> <b>الواجب مطلوب</b></label><label>الواجب بيتحسب خلص لما</label><select onchange="_qz.asg_mode=this.value"><option value="approved" ${z.asg_mode==='approved'?'selected':''}>أحمد يوافق عليه</option><option value="submitted" ${z.asg_mode==='submitted'?'selected':''}>الطالب يرفعه بس</option></select><h3 style="margin:16px 0 4px">❓ أسئلة الامتحان (اختيار من متعدد)</h3>${qs||'<p class="small">لسه مفيش أسئلة.</p>'}<button class="btn ghost" onclick="qzAddQ()">➕ سؤال جديد</button><div id="qzMsg" style="margin-top:10px"></div><button class="btn" onclick="qzSave()">💾 حفظ</button></div>`; }
function qzAddQ(){ _qz.questions.push({q:'',o:['',''],c:0}); qzRender(); }
function qzDelQ(i){ _qz.questions.splice(i,1); qzRender(); }
function qzAddO(i){ _qz.questions[i].o.push(''); qzRender(); }
function qzDelO(i,j){ const q=_qz.questions[i]; q.o.splice(j,1); if(q.c>=q.o.length) q.c=0; else if(q.c>j) q.c--; qzRender(); }
async function qzSave(){ const z=window._qz; const m=document.getElementById('qzMsg'); for(const q of z.questions){ if(!q.q.trim()||q.o.some(o=>!o.trim())){ m.innerHTML=msgBox('كمّل نص كل سؤال وكل اختيار','err'); return; } } if(z.quiz_on&&!z.questions.length){ m.innerHTML=msgBox('ضيف سؤال واحد على الأقل أو شيل علامة "فيه امتحان"','err'); return; }
  const r=await sb.rpc('admin_quiz_save',{p_lec:z.id,p_quiz_on:z.quiz_on,p_pass:z.pass||70,p_attempts:z.attempts||0,p_asg_required:z.asg_required,p_asg_mode:z.asg_mode,p_questions:z.questions}); m.innerHTML=r.error?msgBox('حصل خطأ: '+h((r.error.message||'').slice(0,80)),'err'):msgBox('اتحفظ ✅','ok'); }

async function toggleRate(id){ const el=document.getElementById('rate-'+id); if(!el.classList.contains('hidden')){ el.classList.add('hidden'); return; } el.classList.remove('hidden'); const r=await sb.rpc('rating_my',{p_lec:id}); const m=r.data||{stars:0,comment:''}; window._rs=window._rs||{}; window._rs[id]=m.stars||0; el.innerHTML=`<div class="card" style="margin:0"><h3>⭐ تقييمك للمحاضرة</h3><p class="small" style="margin:6px 0">تقييمك بيوصل لأحمد بس ومبيظهرش لأي طالب تاني.</p><div id="stars-${id}" style="font-size:34px;cursor:pointer;direction:ltr;letter-spacing:4px">${[1,2,3,4,5].map(i=>`<span onclick="setStars(${id},${i})" data-i="${i}">${i<=(m.stars||0)?'⭐':'☆'}</span>`).join('')}</div><textarea id="rc-${id}" rows="2" maxlength="500" placeholder="تعليق (اختياري)">${h(m.comment||'')}</textarea><div id="rm-${id}"></div><button class="btn" onclick="saveRate(${id})">إرسال التقييم</button></div>`; }
function setStars(id,n){ window._rs[id]=n; document.querySelectorAll('#stars-'+id+' span').forEach(sp=>{ sp.textContent=(+sp.dataset.i<=n)?'⭐':'☆'; }); }
async function saveRate(id){ const n=(window._rs||{})[id]||0; const m=document.getElementById('rm-'+id); if(!n){ m.innerHTML=msgBox('اختار عدد النجوم الأول','err'); return; } const r=await sb.rpc('rate_lecture',{p_lec:id,p_stars:n,p_comment:document.getElementById('rc-'+id).value}); m.innerHTML=r.error?msgBox('حصل خطأ، جرّب تاني','err'):msgBox('شكراً! تقييمك وصل لأحمد ✅','ok'); }
async function lbCardHtml(){ try{ const r=await sb.rpc('leaderboard'); const d=r.data; if(!d||!(d.rows||[]).length) return ''; const med=['🥇','🥈','🥉']; const rows=d.rows.map(x=>`<tr style="${x.me?'background:rgba(251,191,36,.18)':''}"><td>${med[x.rank-1]||('#'+x.rank)}</td><td>${x.name?h(x.name):'طالب مجهول'}${x.me?' <b>(أنت)</b>':''}</td><td>${x.pts}</td><td>${x.exams}</td></tr>`).join(''); const me=d.mine?`<p style="margin:10px 0">ترتيبك: <b>#${d.mine.rank}</b> · نقاطك: <b>${d.mine.pts}</b></p>`:'<p class="small" style="margin:10px 0">اعمل أول امتحان ليك عشان تدخل اللوحة.</p>'; return `<div class="card"><h2>🏆 لوحة المتصدرين</h2><p class="small" style="margin:6px 0">النقاط = مجموع أعلى درجة ليك في كل امتحان. الأسماء مخفية إلا لو الطالب اختار يظهر اسمه.</p>${me}<div style="overflow:auto"><table><tr><th>الترتيب</th><th>الطالب</th><th>النقاط</th><th>امتحانات</th></tr>${rows}</table></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer"><input type="checkbox" ${d.show?'checked':''} onchange="sb.rpc('lb_opt',{p_show:this.checked}).then(()=>route())" style="width:auto;margin:0"> <span>أظهر اسمي في اللوحة</span></label></div>`; }catch(e){ return ''; } }

/* ===== weekly report / notes / question bank / FAQ ===== */
function wkCard(d){ if(!d) return '<h2>📈 تقرير الأسبوع</h2><p class="small">حصل خطأ في تحميل التقرير.</p>';
  const tile=(ic,t,a)=>{ const cur=(a&&a[0])||0, prev=(a&&a[1])||0; const df=cur-prev; const tr=df>0?`<span style="color:#34d399">▲ ${df}</span>`:df<0?`<span style="color:#f87171">▼ ${-df}</span>`:'<span style="opacity:.6">=</span>'; return `<div style="flex:1 1 150px;min-width:140px;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(6,182,212,.22));border:1px solid rgba(167,139,250,.4)"><div style="font-size:26px">${ic}</div><div style="font-size:30px;font-weight:800">${cur}</div><div class="small">${t}</div><div class="small" style="margin-top:4px">${tr} عن الأسبوع اللي فات (${prev})</div></div>`; };
  const one=(ic,t,v,note)=>`<div style="flex:1 1 150px;min-width:140px;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(236,72,153,.3),rgba(251,191,36,.18));border:1px solid rgba(251,191,36,.4)"><div style="font-size:26px">${ic}</div><div style="font-size:30px;font-weight:800">${v}</div><div class="small">${t}</div>${note?`<div class="small" style="margin-top:4px">${note}</div>`:''}</div>`;
  return `<h2>📈 تقرير الأسبوع</h2><p class="small" style="margin:6px 0 14px">آخر 7 أيام مقارنة بالـ7 أيام اللي قبلهم. الأرقام ليك إنت بس.</p><div style="display:flex;flex-wrap:wrap;gap:12px">${tile('🧑‍🎓','طلاب جدد سجلوا',d.new_students)}${tile('✅','اشتراكات اتفعّلت',d.activated)}${tile('🎬','محاضرات اتفتحت',d.lec_started)}${tile('🏁','محاضرات اتخلصت',d.lec_done)}${tile('📋','محاولات امتحان',d.exams)}${tile('🏆','امتحانات اتنجحت',d.exams_passed)}${tile('📝','واجبات اترفعت',d.asg_new)}${tile('⭐','تقييمات جديدة',d.ratings)}${one('⏳','واجبات مستنياك دلوقتي',d.asg_pending,d.asg_pending?'روح تاب 📝 الواجبات':'')}${one('😴','غايبين أكتر من 5 أيام',d.inactive,'من '+d.active_total+' مفعّل')}${one('⭐','متوسط التقييم الأسبوع ده',d.avg_rating||'—','')}</div>`; }
function noteCard(id,txt){ return `<div class="card" style="margin:0"><h3>🗒️ ملاحظاتي على المحاضرة</h3><p class="small" style="margin:6px 0">الملاحظات دي ليك إنت بس، محدش تاني بيشوفها.</p><textarea id="nt-${id}" rows="5" maxlength="5000" placeholder="اكتب ملاحظاتك هنا...">${h(txt||'')}</textarea><div id="nm-${id}"></div><button class="btn" onclick="saveNote(${id})">💾 احفظ الملاحظات</button></div>`; }
async function toggleNote(id){ const el=document.getElementById('note-'+id); if(!el.classList.contains('hidden')){ el.classList.add('hidden'); return; } el.classList.remove('hidden'); el.innerHTML='<p class="small">جارِ التحميل...</p>'; const r=await sb.rpc('note_get',{p_lec:id}); el.innerHTML=noteCard(id,r.data||''); }
async function saveNote(id){ const m=document.getElementById('nm-'+id); const r=await sb.rpc('note_save',{p_lec:id,p_body:document.getElementById('nt-'+id).value}); m.innerHTML=r.error?msgBox('حصل خطأ، جرّب تاني','err'):msgBox('اتحفظت ✅','ok'); }
window._qb=null; window._qbSel={};
async function qbLoad(){ const r=await sb.rpc('admin_qbank_list'); window._qb=r.data||[]; }
async function qbPanel(){ const box=document.getElementById('qzBox'); if(!box||!window._qz) return; if(window._qb===null) await qbLoad(); let pn=document.getElementById('qbPanel'); if(!pn){ pn=document.createElement('div'); pn.id='qbPanel'; box.appendChild(pn); }
  const mine=window._qz.questions.map((q,i)=>`<button class="btn ghost" style="${_sty_sm};margin:4px" onclick="qbSave(${i})">💾 احفظ سؤال ${i+1} في البنك</button>`).join('');
  const list=(window._qb||[]).map(q=>`<label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:10px;border-radius:12px;background:rgba(10,14,26,.55);cursor:pointer"><input type="checkbox" style="width:auto;margin:4px 0 0" ${window._qbSel[q.id]?'checked':''} onchange="_qbSel[${q.id}]=this.checked"><span style="flex:1"><b>${h(q.question)}</b>${q.explanation?' 💡':''}<br><span class="small">${q.options.map((o,j)=>(j===q.correct?'✅ ':'• ')+h(o)).join(' &nbsp; ')}</span></span><button class="btn ghost" style="${_sty_sm}" onclick="event.preventDefault();qbDel(${q.id})">🗑️</button></label>`).join('');
  pn.innerHTML=`<div class="card" style="margin:16px 0 0;border:1px solid rgba(6,182,212,.5)"><h3>🏦 بنك الأسئلة</h3><p class="small" style="margin:6px 0 10px">اكتب السؤال مرة واحدة، احفظه في البنك، وبعدين استخدمه في أي امتحان. الإضافة بتنسخ السؤال، وتعديله بعد كده في الامتحان مبيغيرش البنك.</p>${mine?`<div>${mine}</div>`:''}<div id="qbMsg"></div><h4 style="margin:12px 0 4px">الأسئلة المحفوظة (${(window._qb||[]).length})</h4>${list||'<p class="small">البنك فاضي لسه.</p>'}${list?`<button class="btn" style="margin-top:12px" onclick="qbUse()">➕ أضف المحدد للامتحان ده</button>`:''}</div>`; }
async function qbSave(i){ const q=window._qz.questions[i]; const m=document.getElementById('qbMsg'); if(!q.q.trim()||q.o.some(o=>!o.trim())){ m.innerHTML=msgBox('كمّل نص السؤال وكل اختياراته الأول','err'); return; } const r=await sb.rpc('admin_qbank_add',{p_q:q.q,p_o:q.o,p_c:q.c,p_tag:null,p_exp:q.e||''}); if(r.error){ m.innerHTML=msgBox('حصل خطأ','err'); return; } await qbLoad(); await qbPanel(); document.getElementById('qbMsg').innerHTML=msgBox('اتحفظ في البنك ✅','ok'); }
async function qbDel(id){ if(!confirm('تمسح السؤال ده من البنك؟ الامتحانات اللي اتنسخ فيها مش هتتأثر.')) return; await sb.rpc('admin_qbank_del',{p_id:id}); delete window._qbSel[id]; await qbLoad(); await qbPanel(); }
function qbUse(){ const ids=Object.keys(window._qbSel).filter(k=>window._qbSel[k]).map(Number); if(!ids.length){ document.getElementById('qbMsg').innerHTML=msgBox('علّم سؤال واحد على الأقل','err'); return; } let n=0; (window._qb||[]).filter(q=>ids.includes(q.id)).forEach(q=>{ if(!window._qz.questions.some(x=>x.q===q.question)){ window._qz.questions.push({q:q.question,o:q.options.slice(),c:q.correct,e:q.explanation||''}); n++; } }); window._qbSel={}; qzRender(); document.getElementById('qbMsg').innerHTML=msgBox('اتضاف '+n+' سؤال. افتكر تضغط حفظ.','ok'); }
{ const _z=qzRender; qzRender=function(){ _z(); qbPanel(); }; }

function weeklyCard(){ return `<div class="card" style="max-width:640px;margin:18px auto;text-align:center;border:2px solid #8b5cf6"><h3>📈 تقريرك الأسبوعي</h3><p class="small" style="margin:6px 0 12px">اعرف عملت إيه الأسبوع ده وإيه اللي لسه ناقص.</p><button class="btn" style="background:linear-gradient(135deg,#8b5cf6,#ec4899)" onclick="studentView='weekly';window.scrollTo(0,0);route()">📈 افتح تقريري</button></div>`; }
async function viewWeekly(){
  const back=`<div style="text-align:left;margin-bottom:12px"><button class="btn ghost" onclick="goHome()">← رجوع</button></div>`;
  setMsg(back+'<div class="card"><p class="small">جارِ التحميل...</p></div>');
  let { data, error } = await sb.rpc('student_weekly'); let _sample=false;
  if(window._asStudent && data && data.ok && !data.total){ _sample=true; data={ok:true,week:{lec_started:2,lec_done:1,asg_sent:1,asg_approved:1,quiz_tries:2,quiz_passed:1},total:6,done:2,missing:[{id:0,title:'مثال: المحاضرة 3',video:true,asg:true,quiz:true},{id:0,title:'مثال: المحاضرة 4',video:true,asg:false,quiz:true}]}; }
  if(error||!data||!data.ok){ setMsg(back+'<div class="card"><p>التقرير متاح للطلاب المفعّلين بس.</p></div>'); return; }
  const w=data.week, pct=data.total?Math.round(100*data.done/data.total):0;
  const box=(n,t,c)=>`<div style="flex:1 1 140px;padding:14px;border-radius:16px;text-align:center;background:linear-gradient(160deg,${c});min-width:0"><div style="font-size:30px;font-weight:800">${n}</div><div class="small">${t}</div></div>`;
  const miss=(data.missing||[]).map(m=>{ const it=[]; if(m.video) it.push('🎬 الفيديو'); if(m.asg) it.push('📝 الواجب'); if(m.quiz) it.push('✅ الامتحان'); return `<div style="padding:12px;border-radius:14px;margin-top:8px;border:1px solid rgba(148,163,184,.35)"><b>${h(m.title)}</b><div class="small" style="margin-top:4px">ناقص: ${it.join(' · ')}</div><button class="btn ghost" style="margin-top:8px;padding:6px 12px" onclick="continueCourse(${m.id})">افتح المحاضرة</button></div>`; }).join('');
  setMsg(back+(_sample?'<div class="card" style="border:2px dashed #f59e0b"><p class="small">👁️ دي بيانات مثال بس عشان تشوف الشكل. الطالب الحقيقي بيشوف أرقامه هو.</p></div>':'')+`<div class="card"><h3>📈 تقريري آخر 7 أيام</h3>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
  ${box(w.lec_started,'محاضرات بدأتها','rgba(59,130,246,.3),rgba(30,58,138,.4)')}${box(w.lec_done,'محاضرات خلّصتها','rgba(16,185,129,.3),rgba(6,78,59,.4)')}
  ${box(w.asg_sent,'واجبات سلّمتها','rgba(245,158,11,.3),rgba(120,53,15,.4)')}${box(w.asg_approved,'واجبات اتوافق عليها','rgba(236,72,153,.3),rgba(131,24,67,.4)')}
  ${box(w.quiz_tries,'محاولات امتحان','rgba(139,92,246,.3),rgba(76,29,149,.4)')}${box(w.quiz_passed,'امتحانات نجحت فيها','rgba(14,165,233,.3),rgba(7,89,133,.4)')}</div></div>
  <div class="card"><h3>🎯 تقدمك في الكورس</h3><p class="small" style="margin:6px 0">خلّصت ${data.done} من ${data.total} محاضرة (${pct}%)</p><div style="height:14px;border-radius:99px;background:rgba(148,163,184,.25);overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b)"></div></div></div>
  <div class="card"><h3>📌 لسه ناقص</h3>${miss||'<p class="small" style="margin-top:8px">'+(data.total?'مفيش حاجة ناقصة، كمّل كده! 🎉':'لسه مفيش محاضرات اتضافت.')+'</p>'}</div>`);
}

  app.insertAdjacentHTML('afterbegin','<div class="card" data-tab="dash"><h2>📊 ملخص الأرقام</h2><div id="dashBox" style="margin-top:12px"><p class="small">جارِ التحميل...</p></div></div><div class="card" data-tab="export"><h2>⬇️ تصدير Excel</h2><p class="small" style="margin:8px 0 12px">بضغطة واحدة بتنزّل ملفين: الطلاب (الاسم، الكود، الموبايل، الرصيد، الحالة...) وكل عمليات المحفظة والمدفوعات. الملفات CSV بتتفتح في Excel والعربي بيظهر صح. فيها بيانات شخصية فاحفظها في مكان آمن ومتشاركهاش.</p><button class="btn" onclick="exportGo()">⬇️ نزّل الطلاب والمدفوعات</button><div id="bkmsg" style="margin-top:10px"></div></div>');

async function dashInit(){ const box=document.getElementById('dashBox'); if(!box) return; const r=await sb.rpc('admin_dashboard'); if(r.error||!r.data){ box.innerHTML=msgBox('حصل خطأ في تحميل الأرقام','err'); return; } const d=r.data;
  const c=(n,t,col)=>`<div style="flex:1 1 150px;padding:16px;border-radius:16px;text-align:center;background:linear-gradient(160deg,${col});min-width:0"><div style="font-size:34px;font-weight:800">${n}</div><div class="small">${t}</div></div>`;

async function qbtInit(){ const r=await sb.rpc('admin_qbank_list'); window._qbt.list=r.data||[]; qbtRender(); }
function qbtFilt(){ const t=window._qbt, q=(t.q||'').trim().toLowerCase(); return t.list.filter(x=>(t.f==='all'||(t.f==='noexp'&&!x.explanation))&&(!q||(x.question+' '+x.options.join(' ')+' '+(x.explanation||'')).toLowerCase().includes(q))); }
function qbtRender(){ const box=document.getElementById('qbtBox'); if(!box) return; const t=window._qbt; const fl=qbtFilt(); const noexp=t.list.filter(x=>!x.explanation).length;
  const L='ABCDEF';
  const item=x=>`<div style="padding:12px;border-radius:14px;margin-top:8px;background:rgba(10,14,26,.55)">${t.edit===x.id?qbtForm(x):`<b>${h(x.question)}</b><div class="small" style="margin-top:6px">${x.options.map((o,j)=>`<div>${j===x.correct?'✅':'▫️'} ${h(o)}</div>`).join('')}</div>${x.explanation?`<div class="small" style="margin-top:6px;color:#fbbf24">💡 ${h(x.explanation)}</div>`:'<div class="small" style="margin-top:6px;opacity:.7">مفيش شرح للسؤال ده</div>'}<div style="margin-top:8px;display:flex;gap:8px"><button class="btn ghost" style="${_sty_sm}" onclick="qbtEdit(${x.id})">✏️ تعديل</button><button class="btn ghost" style="${_sty_sm}" onclick="qbtDel(${x.id})">🗑️ مسح</button></div>`}</div>`;
  box.innerHTML=`<p class="small">البنك فيه ${t.list.length} سؤال (${noexp} من غير شرح). السؤال بيتنسخ للامتحان لما تضيفه، فتعديله هنا مبيغيرش امتحانات اتعملت قبل كده.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="qbtQ" style="flex:1 1 220px" placeholder="🔎 دوّر في الأسئلة والاختيارات والشرح" value="${h(t.q)}" oninput="window._qbt.q=this.value;window._qbt.max=30;qbtRender();document.getElementById('qbtQ').focus();"><select id="qbtF" style="flex:0 0 auto" onchange="window._qbt.f=this.value;window._qbt.max=30;qbtRender()"><option value="all" ${t.f==='all'?'selected':''}>كل الأسئلة</option><option value="noexp" ${t.f==='noexp'?'selected':''}>من غير شرح</option></select><button class="btn" onclick="qbtEdit(0)">➕ سؤال جديد</button></div>
  <div id="qbtMsg"></div><p class="small" style="margin-top:8px">النتيجة: ${fl.length} من ${t.list.length}</p>${t.edit===0?`<div style="padding:12px;border-radius:14px;margin-top:8px;background:rgba(10,14,26,.55);border:1px solid #06b6d4">${qbtForm({id:0,question:'',options:['','','',''],correct:0,explanation:''})}</div>`:''}
  ${fl.slice(0,t.max).map(item).join('')||'<p class="small">مفيش نتايج.</p>'}${fl.length>t.max?`<button class="btn ghost" style="margin-top:12px" onclick="window._qbt.max+=30;qbtRender()">عرض كمان (${fl.length-t.max})</button>`:''}`; }
function qbtForm(x){ const ed=window._qbt.draft||x; return `<label class="small">نص السؤال</label><textarea id="qe-q" rows="2">${h(ed.question)}</textarea><div id="qe-opts">${ed.options.map((o,j)=>`<div style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="radio" name="qe-c" style="width:auto" value="${j}" ${j===ed.correct?'checked':''}><input class="qe-o" style="flex:1" value="${h(o)}" placeholder="اختيار ${j+1}"></div>`).join('')}</div><p class="small" style="margin-top:4px">الدايرة بتحدد الإجابة الصح.</p><div style="display:flex;gap:8px;margin-top:6px"><button class="btn ghost" style="${_sty_sm}" onclick="qbtOpt(1)">➕ اختيار</button><button class="btn ghost" style="${_sty_sm}" onclick="qbtOpt(-1)">➖ اختيار</button></div><label class="small" style="margin-top:8px;display:block">شرح الإجابة (بيظهر للطالب بعد التسليم)</label><textarea id="qe-e" rows="2">${h(ed.explanation||'')}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="qbtSave(${x.id})">💾 احفظ</button><button class="btn ghost" onclick="qbtCancel()">إلغاء</button></div>`; }
function qbtRead(){ const o=[...document.querySelectorAll('.qe-o')].map(e=>e.value); const c=document.querySelector('input[name=qe-c]:checked'); return {question:document.getElementById('qe-q').value,options:o,correct:c?+c.value:0,explanation:document.getElementById('qe-e').value}; }
function qbtOpt(d){ const dr=qbtRead(); if(d>0&&dr.options.length<6) dr.options.push(''); if(d<0&&dr.options.length>2){ dr.options.pop(); if(dr.correct>=dr.options.length) dr.correct=0; } window._qbt.draft=dr; qbtRender(); }
function qbtEdit(id){ window._qbt.draft=null; window._qbt.edit=id; qbtRender(); }
function qbtCancel(){ window._qbt.draft=null; window._qbt.edit=null; qbtRender(); }
async function qbtSave(id){ const d=qbtRead(); const m=document.getElementById('qbtMsg'); if(!d.question.trim()||d.options.some(o=>!o.trim())){ m.innerHTML=msgBox('كمّل نص السؤال وكل الاختيارات الأول','err'); window.scrollTo(0,0); return; }
  const r=id?await sb.rpc('admin_qbank_update',{p_id:id,p_q:d.question,p_o:d.options,p_c:d.correct,p_exp:d.explanation}):await sb.rpc('admin_qbank_add',{p_q:d.question,p_o:d.options,p_c:d.correct,p_tag:null,p_exp:d.explanation});
  if(r.error){ m.innerHTML=msgBox('حصل خطأ، جرّب تاني','err'); return; } window._qbt.draft=null; window._qbt.edit=null; await qbtInit(); document.getElementById('qbtMsg').innerHTML=msgBox('اتحفظ ✅','ok'); }
async function qbtDel(id){ if(!confirm('تمسح السؤال ده من البنك؟ الامتحانات اللي اتنسخ فيها مش هتتأثر.')) return; await sb.rpc('admin_qbank_del',{p_id:id}); await qbtInit(); }
/* view as student (preview mode: no writes) */
if(!window._sbWrapped){ window._sbWrapped=true; const _f=sb.from.bind(sb), _r=sb.rpc.bind(sb); const RO=['student_lectures','student_weekly','quiz_get','note_get','promo_my','promo_info','ann_list','qa_list','leaderboard','rating_my','public_courses','coupon_check','chat_staff_info','lecture_play'];
  sb.from=function(t){ const b=_f(t); if(!window._asStudent) return b; return new Proxy(b,{get(o,k){ if(['insert','update','upsert','delete'].includes(k)) return ()=>Promise.resolve({data:null,error:{message:'وضع المعاينة'}}); const v=o[k]; return typeof v==='function'?v.bind(o):v; }}); };
  sb.rpc=function(n,a,o){ if(window._asStudent && !RO.includes(n)) return Promise.resolve({data:null,error:{message:'وضع المعاينة'}}); return _r(n,a,o); }; }
function asBar(){ if(document.getElementById('asBar')) return; const d=document.createElement('div'); d.id='asBar'; d.style.cssText='position:fixed;bottom:10px;left:10px;right:10px;z-index:9998;background:linear-gradient(135deg,#f59e0b,#ec4899);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.4)'; d.innerHTML='<span>👁️ وضع معاينة الطالب: أي حاجة هنا مش بتتسجل</span><button class="btn" style="padding:6px 14px;background:#111827" onclick="exitAs()">خروج</button>'; document.body.appendChild(d); }
function asBarOff(){ const e=document.getElementById('asBar'); if(e) e.remove(); }
function openAs(v){ window._asStudent=true; studentView=v; window.scrollTo(0,0); route(); }
function exitAs(){ window._asStudent=false; curTab='asstudent'; asBarOff(); window.scrollTo(0,0); route(); }

async function finalBannerHtml(active){ try{ if(active||window._asStudent) return ''; const { data } = await sb.rpc('final_status'); if(!data||!data.has_final||!data.exhausted) return ''; return `<div class="card" style="max-width:640px;margin:0 auto 18px;border:2px solid #ef4444"><h3>⛔ اشتراكك اتقفل</h3><p class="small" style="margin-top:6px;line-height:1.9">استخدمت المحاولات التلاتة في الامتحان النهائي ومنجحتش. عشان تكمّل وتاخد الشهادة: ادفع سعر الكورس تاني (1300 جنيه، أو أقل لو معاك كوبون خصم) وابعت اسمك وكودك لأ/ أحمد، وهو هيفتحلك الكورس من الأول والتقدم هيتصفّر.</p></div>`; }catch(e){ return ''; } }
async function qzFinal(on){ const z=window._qz; const r=await sb.rpc('admin_set_final',{p_lec:z.id,p_on:on}); const m=document.getElementById('qzMsg'); if(r.error){ z.is_final=!on; if(m) m.innerHTML=msgBox(/quiz/.test(r.error.message||'')?'فعّل "فيه امتحان" واحفظ الأول':'حصل خطأ','err'); } else { z.is_final=on; if(on) z.attempts=3; if(m) m.innerHTML=msgBox(on?'اتحدد كامتحان نهائي ✅ (3 محاولات)':'اتشال من كونه نهائي','ok'); } qzRender(); }
async function restartCourse(sid,name){ if(!confirm('تفتح الكورس من الأول لـ «'+name+'»؟ التقدم والمحاولات والواجبات هتتصفّر (بتتحفظ نسخة في الأرشيف) والكورس هيتفعّل. اعمل ده بعد ما تستلم الدفع بس.')) return; const reason=prompt('سبب إعادة الكورس:','دفع سعر الكورس تاني بعد استنفاد محاولات الامتحان النهائي'); if(reason===null||reason.trim().length<2){ return; } const { error } = await sb.rpc('admin_restart_course',{target:sid,reason}); if(error){ alert('حصل خطأ: '+error.message); return; } route(); }
function faqLinkCard(){ return `<div class="card" style="max-width:640px;margin:18px auto"><p class="center"><a class="btn ghost" href="#faq" onclick="location.hash='faq';return false">❓ الأسئلة الشائعة (الدفع، الشحن، الشهادة، الشروط)</a></p></div>`; }
function viewFaq(inApp){ const qa=[
 ['إزاي أشترك في الكورس؟','اعمل حساب جديد على المنصة، وبعدين اشحن رصيدك واشتري الكورس من صفحة الكورسات. بعد الشراء الكورس بيتفتحلك على طول.'],
 ['إزاي أشحن رصيدي؟','حوّل المبلغ على اتصالات كاش 01143757857، وبعدين ابعت لأحمد على واتساب اسمك وكودك (6 أرقام بتلاقيه في صفحة شحن الرصيد). الرصيد بيتضاف بعد ما أحمد يتأكد من التحويل.'],
 ['الرصيد ده ممكن أسحبه كاش؟','لأ. الرصيد جوه المنصة وبيتصرف على الكورس بس، ومش بيتحوّل لفلوس ومش بيتسحب.'],
 ['أقدر أسترجع فلوس الكورس بعد الشراء؟','لأ. بعد ما تأكد الشراء مفيش استرجاع للمبلغ، سواء فتحت المحاضرات أو لأ، لأن الكورس محتوى رقمي بيتفتح فوراً. لو حصل خطأ من المنصة نفسها (زي خصم مرتين) أحمد بيصلحه وبيرجّع المبلغ كرصيد في محفظتك على المنصة بس، مش كاش.'],
 ['إزاي أخلص الكورس وآخد الشهادة؟','المحاضرة بتتحسب خلصت لما الفيديو يوصل لآخره، وكمان الامتحان والواجب لو مطلوبين فيها. المحاضرة اللي بعدها بتتفتح لوحدها، ولما تخلص كل المحاضرات بتقدر تطلب شهادة اتمام الكورس من صفحة الكورسات.'],
 ['إيه نسبة النجاح في الامتحان؟','نسبة النجاح العادية 70%، وأحمد ممكن يغيرها أو يحدد عدد المحاولات لكل امتحان، والمكتوب في صفحة الامتحان هو المعتمد. الامتحان النهائي ليه قاعدة خاصة (شوف سؤال الامتحان النهائي).'],
 ['إيه نظام الامتحان النهائي والشهادة؟','الامتحان النهائي هو اللي بيحدد الشهادة، وليه 3 محاولات بالظبط. لو استخدمت المحاولات التلاتة ومنجحتش، اشتراكك بيتقفل تلقائي. ولو عايز تكمّل، بتدفع سعر الكورس تاني بالسعر العادي (1300 جنيه، أو أقل لو معاك كوبون خصم) وأحمد بيفتحلك الكورس من الأول والتقدم بيتصفّر.'],
 ['الواجب بيتحسب إمتى؟','الواجب غالباً بيتحسب خلص لما أحمد يوافق عليه، وفي بعض المحاضرات لما ترفعه بس. المكتوب في المحاضرة هو المعتمد.'],
 ['في ضمان لنتيجة معينة؟','لأ. الكورس بيشرح ويدرّب، ونتيجتك بتعتمد على مجهودك وتطبيقك. مفيش وعد بوظيفة أو دخل.'],
 ['ينفع أشارك الفيديوهات أو أسجلها؟','لأ. المحتوى لاستخدامك الشخصي بس. ممنوع المشاركة أو التسجيل أو إعادة النشر، ولو حصل الحساب ممكن يتقفل من غير استرجاع.'],
 ['نسيت كلمة السر أو عندي مشكلة في الدفع أو الخصم؟','من صفحة الدخول اضغط "نسيت كلمة السر". ولأي مشكلة في دفع أو خصم كلّم أحمد على واتساب 01143757857 ومعاك اسمك وكودك وتاريخ العملية.']
 ];
 setMsg(`<div style="max-width:700px;margin:0 auto;width:100%"><div class="card"><h2 style="margin-bottom:6px">❓ الأسئلة الشائعة</h2><p class="small" style="margin-bottom:12px">الإجابات دي متوافقة مع شروط المنصة وسياسة الاسترجاع.</p>${qa.map(x=>`<details style="margin:8px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(6,182,212,.16));border:1px solid rgba(167,139,250,.4)"><summary style="cursor:pointer;font-weight:700">${x[0]}</summary><p style="margin-top:10px;line-height:1.9">${x[1]}</p></details>`).join('')}<a class="btn wa" style="margin-top:10px" target="_blank" rel="noopener noreferrer" href="https://wa.me/201143757857">كلّم أحمد على واتساب</a><p style="margin-top:14px"><button class="btn ghost" onclick="history.replaceState(null,'',location.pathname+location.search);route()">${inApp?'← رجوع للمنصة':'← رجوع لتسجيل الدخول'}</button></p></div></div>`); }
function showReview(id,rv){ (rv||[]).forEach(x=>{ const ins=[...document.querySelectorAll('input[name="qz-'+x.id+'"]')]; if(!ins.length) return; const box=ins[0].closest('div'); box.querySelectorAll('.qrev').forEach(e=>e.remove()); let ca=''; if(x.correct!==undefined&&x.correct!==null){ const ci=ins[x.correct]; ca=ci?`<div class="small" style="margin-top:6px">✅ الإجابة الصح: <b>${h(ci.nextElementSibling.innerText)}</b></div>`:''; }
  box.style.border='1px solid '+(x.ok?'rgba(52,211,153,.7)':'rgba(248,113,113,.7)'); box.insertAdjacentHTML('beforeend',`<div class="qrev" style="margin-top:10px;padding:10px;border-radius:10px;background:${x.ok?'rgba(52,211,153,.12)':'rgba(248,113,113,.12)'}"><b>${x.ok?'✅ إجابتك صح':'❌ إجابتك غلط'}</b>${ca}${x.e?`<div style="margin-top:8px;line-height:1.8">💡 <b>الشرح:</b> ${h(x.e)}</div>`:''}</div>`); }); }

async function continueCourse(id){ studentView='lectures'; await route(); const e=document.getElementById('lec-'+id); if(e){ e.scrollIntoView({behavior:'smooth',block:'start'}); e.style.boxShadow='0 0 0 3px #f59e0b'; setTimeout(()=>{ e.style.boxShadow=''; },2500); } }
function stFilter(){ const q=(document.getElementById('stq').value||'').trim().toLowerCase(); const f=document.getElementById('stf').value; const qd=q.replace(/\D/g,''); let n=0,t=0; document.querySelectorAll('#stTable tr.strow').forEach(r=>{ t++; const hay=r.dataset.s||''; const okQ=!q||hay.includes(q)||(qd.length>=3&&hay.replace(/\D/g,'').includes(qd)); const okF=!f||r.dataset.st===f; const show=okQ&&okF; r.style.display=show?'':'none'; if(show) n++; }); document.getElementById('stcnt').textContent=(q||f)?('النتيجة: '+n+' من '+t):''; }

window.addEventListener('hashchange',()=>{ if(location.hash==='#faq') route(); });

route();
